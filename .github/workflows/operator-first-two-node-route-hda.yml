name: operator-first-two-node-route-hda

# Fast but nontrivial Peter-Weyl gate: run on branch pushes only when its
# operator implementation changes. This avoids duplicate PR synchronize runs.
on:
  push:
    paths:
      - 'scripts/operator_first_two_node_route_hda_gate.py'
      - 'scripts/operator_first_route_hda_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/operator-first-two-node-route-hda.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/operator_first_two_node_route_hda_gate.py
      - name: Exact two-node operator-first route HDA
        run: |
          python scripts/operator_first_two_node_route_hda_gate.py \
            --L 48 \
            --output verification_results/OPERATOR_FIRST_TWO_NODE_ROUTE_HDA.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-first-two-node-route-hda
          path: verification_results/OPERATOR_FIRST_TWO_NODE_ROUTE_HDA.json
          if-no-files-found: warn

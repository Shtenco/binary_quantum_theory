name: q4-k5-local-carrier-bridge-research

on:
  push:
    branches:
      - 'audit/q4-k5-local-carrier-bridge'
    paths:
      - 'Q4_K5_LOCAL_CARRIER_BRIDGE_PREREGISTRATION.md'
      - 'scripts/q4_k5_local_carrier_bridge_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/q4-k5-local-carrier-bridge-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q4-k5-local-carrier-bridge-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-carrier-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile local carrier bridge
        run: python -m py_compile scripts/q4_k5_local_carrier_bridge_gate.py
      - name: Run preregistered exact Q4-K5 local carrier bridge
        run: |
          python scripts/q4_k5_local_carrier_bridge_gate.py \
            --output verification_results/Q4_K5_LOCAL_CARRIER_BRIDGE.json
      - name: Guard theorem scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('verification_results/Q4_K5_LOCAL_CARRIER_BRIDGE.json').read_text())
          assert x['passed'] is True
          assert x['global_graph_isomorphism_claimed'] is False
          assert x['checks']['raw_basis_overlap_is_identity_without_fit'] is True
          assert x['checks']['all_24_induced_S4_matrices_identical'] is True
          assert x['checks']['both_characters_equal_irrep_[2,2]'] is True
          assert x['checks']['both_local_trivial_projectors_vanish'] is True
          assert 'Q4 and K5 are not asserted to be globally isomorphic' in x['claim_boundary']
          print('Q4-K5 local carrier bridge scope guard: PASS')
          print('science_status:', x['science_status'])
          print('raw_overlap_error:', x['raw_overlap_operator_norm_error_to_identity'])
          print('max_S4_bridge_error:', x['max_S4_representation_bridge_error'])
          PY
      - name: Upload local carrier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-k5-local-carrier-bridge-evidence
          path: verification_results/Q4_K5_LOCAL_CARRIER_BRIDGE.json
          if-no-files-found: error

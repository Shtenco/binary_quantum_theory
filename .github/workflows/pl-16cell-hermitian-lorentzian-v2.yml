name: pl-16cell-hermitian-lorentzian-v2

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'PL_16CELL_HERMITIAN_LORENTZIAN_PREREGISTRATION_V2.md'
      - 'scripts/tetrahedral_volume_backend.py'
      - 'scripts/tetrahedral_charged_volume_audit_gate.py'
      - 'scripts/pl_lorentzian_triple_worker.py'
      - 'scripts/pl_lorentzian_group_worker.py'
      - 'scripts/pl_lorentzian_group_worker_v2.py'
      - 'scripts/pl_lorentzian_48_collect.py'
      - 'scripts/pl_lorentzian_48_collect_v2.py'
      - '.github/workflows/pl-16cell-hermitian-lorentzian-v2.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax and forced-correction audit
        run: |
          python -m py_compile scripts/tetrahedral_volume_backend.py scripts/tetrahedral_charged_volume_audit_gate.py scripts/pl_lorentzian_group_worker_v2.py scripts/pl_lorentzian_48_collect_v2.py
          python scripts/tetrahedral_charged_volume_audit_gate.py --output verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json
      - name: Require covariance correction before heavy workers
        run: |
          python - <<'PY'
          import json
          d=json.load(open('verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json'))
          assert d['passed']
          assert d['checks']['charged_q123_preferred_leg_negative_control']
          assert d['checks']['K5_H_E_sine_exactly_preserved']
          assert d['checks']['16cell_H_E_sine_exactly_preserved']
          assert d['checks']['tetra_CV_slot_covariance_restored']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tetrahedral-volume-preflight
          path: verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json
          if-no-files-found: error

  shards:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [forward, adjoint]
        slot: [0,1,2,3]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Six exact V2 ordered terms with shared caches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          python scripts/pl_lorentzian_group_worker_v2.py --mode "${{ matrix.mode }}" --first-slot ${{ matrix.slot }} --source 0 --out-dir out
      - name: Require six individually serialized V2 terms
        shell: pwsh
        run: |
          $j=(Get-ChildItem out -Filter 'term_*.json').Count
          $n=(Get-ChildItem out -Filter 'term_*.npz').Count
          if ($j -ne 6 -or $n -ne 6) { throw "Expected 6 V2 JSON/NPZ terms; got $j/$n" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-lorentzian-v2-${{ matrix.mode }}-${{ matrix.slot }}
          path: out/
          if-no-files-found: error

  collect:
    needs: shards
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: pl-lorentzian-v2-*
          path: out
          merge-multiple: true
      - name: Require the full 24+24 V2 orbit
        shell: pwsh
        run: |
          $j=(Get-ChildItem out -Filter 'term_*.json').Count
          $n=(Get-ChildItem out -Filter 'term_*.npz').Count
          if ($j -ne 48 -or $n -ne 48) { throw "Expected 48 V2 JSON/NPZ terms; got $j/$n" }
      - name: Exact V2 reduction and Hermitian completion
        run: python scripts/pl_lorentzian_48_collect_v2.py --root out --json-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2.json --state-output verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2.npz
      - name: Guard preregistered V2 semantics
        shell: pwsh
        run: |
          python -c "import json; d=json.load(open('verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2.json')); assert d['passed']; assert d['operator_version']=='tetrahedral-charged-volume-v2'; assert d['worker_count']==48; assert d['max_worker_physical_leakage']<1e-8; assert d['wrong_seed_parity_outputs']==0; assert d['max_spin_S']<=3.5+1e-12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-16cell-hermitian-lorentzian-v2
          path: |
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2.json
            verification_results/PL_16CELL_HERMITIAN_LORENTZIAN_V2.npz
          if-no-files-found: error

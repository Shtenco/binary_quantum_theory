name: cosmology-interference-frontier

on:
  push:
    branches: [main]
    paths:
      - 'UNIFIED_PHYSICAL_COSMOLOGY_INTERFERENCE.md'
      - 'COSMOLOGY_INTERFERENCE_PREREGISTRATION.md'
      - 'cosmology_interference_gates.json'
      - 'scripts/binary_history_interference_lensing_gate.py'
      - 'scripts/physical_cosmology_background_scalar_gate.py'
      - 'scripts/verify_cosmology_interference_frontier.py'
      - '.github/workflows/cosmology-interference-frontier.yml'
  pull_request:
    branches: [main]
    paths:
      - 'UNIFIED_PHYSICAL_COSMOLOGY_INTERFERENCE.md'
      - 'COSMOLOGY_INTERFERENCE_PREREGISTRATION.md'
      - 'cosmology_interference_gates.json'
      - 'scripts/binary_history_interference_lensing_gate.py'
      - 'scripts/physical_cosmology_background_scalar_gate.py'
      - 'scripts/verify_cosmology_interference_frontier.py'
      - '.github/workflows/cosmology-interference-frontier.yml'

permissions:
  contents: read

concurrency:
  group: cosmology-interference-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-and-truth-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile new gates
        run: |
          python -m py_compile \
            scripts/binary_history_interference_lensing_gate.py \
            scripts/physical_cosmology_background_scalar_gate.py \
            scripts/verify_cosmology_interference_frontier.py
      - name: Validate fail-closed frontier ledger
        run: |
          python scripts/verify_cosmology_interference_frontier.py \
            --output verification_results/COSMOLOGY_INTERFERENCE_FRONTIER.json
      - name: Binary-history interference and lensing phase reference
        run: |
          python scripts/binary_history_interference_lensing_gate.py \
            --output verification_results/BINARY_HISTORY_INTERFERENCE_LENSING.json
      - name: Background/scalar cosmology reference
        run: |
          python scripts/physical_cosmology_background_scalar_gate.py \
            --output verification_results/PHYSICAL_COSMOLOGY_BACKGROUND_SCALAR.json
      - name: Cross-guard reference PASS versus physical OPEN
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path('verification_results', name).read_text())

          frontier = load('COSMOLOGY_INTERFERENCE_FRONTIER.json')
          light = load('BINARY_HISTORY_INTERFERENCE_LENSING.json')
          cosmo = load('PHYSICAL_COSMOLOGY_BACKGROUND_SCALAR.json')

          assert frontier['valid'] is True
          assert light['passed'] is True
          assert cosmo['passed'] is True
          assert frontier['physical_outputs_frozen'] is False
          for status in frontier['physical_gate_statuses'].values():
              assert status == 'open_physical'

          # The split-potential and split-lensing negative controls must remain visibly nonzero.
          assert light['point_lens_bad_split_potential_residual'] > 1e-3
          assert cosmo['scalar_lensing_controls']['split_lensing_dynamics_mass_mismatch'] > 0.1
          print('cosmology/interference fail-closed cross-guard: PASS')
          PY
      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-interference-frontier-evidence
          path: verification_results/
          if-no-files-found: error

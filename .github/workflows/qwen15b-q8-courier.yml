name: Qwen 1.5B Q8 courier
on:
  push:
    branches: [exp/qwen15b-q8-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official Qwen 1.5B Q8 GGUF
        run: |
          mkdir -p payload/chunks
          curl -L --fail --retry 8 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q8_0.gguf?download=true" \
            -o payload/qwen2.5-1.5b-instruct-q8_0.gguf
          echo "d7efb072e7724d25048a4fda0a3e10b04bdef5d06b1403a1c93bd9f1240a63c8  payload/qwen2.5-1.5b-instruct-q8_0.gguf" | sha256sum -c -
          stat -c '%s %n' payload/qwen2.5-1.5b-instruct-q8_0.gguf
          split -b 50M -d -a 2 payload/qwen2.5-1.5b-instruct-q8_0.gguf payload/chunks/qwen15b-q8.gguf.part.
          test "$(find payload/chunks -type f | wc -l)" -eq 37
          ls -lh payload/chunks

      - name: Upload Q8 chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: qwen15b-q8-chunk-00
          path: payload/chunks/qwen15b-q8.gguf.part.00
          compression-level: 0
          retention-days: 3

      - name: Upload Q8 chunk 01
        uses: actions/upload-artifact@v4

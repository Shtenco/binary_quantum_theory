name: peter-weyl-lorentzian-single-probe

on:
  push:
    branches:
      - research/pw-lorentzian-single-probe

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_single_logical_probe.py
      - name: Single ordered Lorentzian logical return
        run: |
          python scripts/peter_weyl_lorentzian_single_logical_probe.py \
            --output verification_results/PETER_WEYL_LORENTZIAN_SINGLE_LOGICAL_PROBE.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-single-logical-probe-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_SINGLE_LOGICAL_PROBE.json

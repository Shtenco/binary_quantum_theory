name: BQG global ancilla master selection

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_global_ancilla_master_selection_gate.py'
      - '.github/workflows/bqg-global-ancilla-master.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute global K5 ancilla master selection
        run: python scripts/bqg_global_ancilla_master_selection_gate.py

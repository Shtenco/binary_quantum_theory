name: Qwen F16 courier
on:
  push:
    branches: [exp/qwen-f16-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"
          python -m pip install "huggingface_hub>=0.35" "transformers>=4.45,<5" "safetensors>=0.4" "sentencepiece>=0.2"
      - name: Download official Qwen HF model
        run: |
          mkdir -p payload/hf payload/chunks
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p=snapshot_download(
              "Qwen/Qwen2.5-0.5B-Instruct",
              local_dir="payload/hf",
              allow_patterns=["*.json","*.safetensors","tokenizer*","merges.txt","vocab.json"],
          )
          print(p)
          PY
          find payload/hf -maxdepth 2 -type f -printf '%s %p\n' | sort -nr
      - name: Fetch pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 5f436dddb440a288ee5611d7d1eca564a6aca9f4
          path: llama.cpp
          fetch-depth: 1
      - name: Convert HF to F16 GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py payload/hf             --outfile payload/qwen2.5-0.5b-instruct-f16.gguf             --outtype f16
          ls -lh payload/qwen2.5-0.5b-instruct-f16.gguf
          sha256sum payload/qwen2.5-0.5b-instruct-f16.gguf | tee payload/f16.sha256
          split -b 50M -d -a 2 payload/qwen2.5-0.5b-instruct-f16.gguf payload/chunks/qwen-f16.gguf.part.
          ls -lh payload/chunks
      - name: Upload F16 chunk 00
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-00, path: payload/chunks/qwen-f16.gguf.part.00, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 01
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-01, path: payload/chunks/qwen-f16.gguf.part.01, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 02
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-02, path: payload/chunks/qwen-f16.gguf.part.02, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 03
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-03, path: payload/chunks/qwen-f16.gguf.part.03, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 04
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-04, path: payload/chunks/qwen-f16.gguf.part.04, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 05
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-05, path: payload/chunks/qwen-f16.gguf.part.05, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 06
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-06, path: payload/chunks/qwen-f16.gguf.part.06, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 07
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-07, path: payload/chunks/qwen-f16.gguf.part.07, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 08
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-08, path: payload/chunks/qwen-f16.gguf.part.08, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 09
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-09, path: payload/chunks/qwen-f16.gguf.part.09, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 10
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-10, path: payload/chunks/qwen-f16.gguf.part.10, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 11
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-11, path: payload/chunks/qwen-f16.gguf.part.11, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 12
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-12, path: payload/chunks/qwen-f16.gguf.part.12, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 13
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-13, path: payload/chunks/qwen-f16.gguf.part.13, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 14
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-14, path: payload/chunks/qwen-f16.gguf.part.14, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 15
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-15, path: payload/chunks/qwen-f16.gguf.part.15, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 16
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-16, path: payload/chunks/qwen-f16.gguf.part.16, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 17
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-17, path: payload/chunks/qwen-f16.gguf.part.17, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 18
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-18, path: payload/chunks/qwen-f16.gguf.part.18, compression-level: 0, retention-days: 3}
      - name: Upload F16 chunk 19
        uses: actions/upload-artifact@v4
        with: {name: qwen-f16-chunk-19, path: payload/chunks/qwen-f16.gguf.part.19, compression-level: 0, retention-days: 3}
      - name: Upload SHA manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen-f16-sha
          path: payload/f16.sha256
          retention-days: 3
name: Qwen official FP16 courier
on:
  push:
    branches: [exp/qwen-f16-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download official Qwen FP16 GGUF
        run: |
          mkdir -p payload/chunks
          curl -L --fail --retry 8 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-fp16.gguf?download=true" \
            -o payload/qwen2.5-0.5b-instruct-official-fp16.gguf
          echo "8e0ae26000627ed62de0e78e41860af70094558b9d2913385c842a6aa06cf3fc  payload/qwen2.5-0.5b-instruct-official-fp16.gguf" | sha256sum -c -
          stat -c '%s %n' payload/qwen2.5-0.5b-instruct-official-fp16.gguf
          split -b 50M -d -a 2 payload/qwen2.5-0.5b-instruct-official-fp16.gguf payload/chunks/qwen-official-fp16.gguf.part.
          ls -lh payload/chunks

      - name: Upload official FP16 chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: qwen-official-fp16-chunk-00
          path: payload/chunks/qwen-official-fp16.gguf.part.00
          compression-level: 0
          retention-days: 3

      - name: Upload official FP16 chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: qwen-official-fp16-chunk-01
          path: payload/chunks/qwen-official-fp16.gguf.part.01
          compression-level: 0
          retention-days: 3

      - name: Upload official FP16 chunk 02

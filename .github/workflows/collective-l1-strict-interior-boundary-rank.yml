name: collective-l1-strict-interior-boundary-rank

on:
  workflow_dispatch:

jobs:
  exact-boundary-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/collective_l1_strict_interior_boundary_rank_gate.py
      - name: Exact strict-interior boundary contraction
        run: python scripts/collective_l1_strict_interior_boundary_rank_gate.py --output verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json
      - name: Structural theorem guards
        run: |
          python - <<'PY'
          import json
          d=json.load(open('verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json'))
          assert d['passed']
          assert d['structural_boundary_rank']==6
          assert d['coarse_edge_group_census']=={'(0, 1)':4,'(0, 2)':4,'(0, 3)':4,'(1, 2)':4,'(1, 3)':4,'(2, 3)':4}
          assert d['block_model_relative_defect']<1e-10
          assert abs(d['r_inter_edge_overlap']-0.8523308467411363)<1e-10
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-l1-strict-interior-boundary-rank
          path: verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json
          if-no-files-found: error

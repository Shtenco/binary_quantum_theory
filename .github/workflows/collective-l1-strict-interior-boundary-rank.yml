name: collective-l1-strict-interior-boundary-rank

on:
  workflow_dispatch:

jobs:
  exact-boundary-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/collective_l1_strict_interior_boundary_rank_gate.py
          python -m py_compile scripts/collective_l1_background_orthogonal_metric_tangent_gate.py
          python -m py_compile scripts/collective_edge_metric_isomorphism_gate.py
      - name: Exact strict-interior boundary contraction
        run: python scripts/collective_l1_strict_interior_boundary_rank_gate.py --output verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json
      - name: Background-orthogonal six-edge tangent frame
        run: python scripts/collective_l1_background_orthogonal_metric_tangent_gate.py --strict-result verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json --output verification_results/COLLECTIVE_L1_BACKGROUND_ORTHOGONAL_METRIC_TANGENT.json
      - name: Exact six-edge to symmetric-metric isomorphism
        run: python scripts/collective_edge_metric_isomorphism_gate.py --output verification_results/COLLECTIVE_EDGE_METRIC_ISOMORPHISM.json
      - name: Structural theorem guards
        run: |
          python - <<'PY'
          import json
          b=json.load(open('verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json'))
          t=json.load(open('verification_results/COLLECTIVE_L1_BACKGROUND_ORTHOGONAL_METRIC_TANGENT.json'))
          m=json.load(open('verification_results/COLLECTIVE_EDGE_METRIC_ISOMORPHISM.json'))
          assert b['passed'] and t['passed'] and m['passed']
          assert b['structural_boundary_rank']==6
          assert b['coarse_edge_group_census']=={'(0, 1)':4,'(0, 2)':4,'(0, 3)':4,'(1, 2)':4,'(1, 3)':4,'(2, 3)':4}
          assert b['block_model_relative_defect']<1e-10
          assert abs(b['r_inter_edge_overlap']-0.8523308467411363)<1e-10
          assert t['projected_structural_rank']==6
          assert abs(t['projected_inter_edge_overlap']) < 1e-18
          assert abs(t['projected_nonzero_eigenvalue_sixfold']-1.8533582468929123e-10)<1e-20
          assert m['Jacobian_rank']==6
          assert m['Jacobian_determinant_exact']=='-sqrt(2)/2'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-l1-metric-tangent
          path: |
            verification_results/COLLECTIVE_L1_STRICT_INTERIOR_BOUNDARY_RANK.json
            verification_results/COLLECTIVE_L1_BACKGROUND_ORTHOGONAL_METRIC_TANGENT.json
            verification_results/COLLECTIVE_EDGE_METRIC_ISOMORPHISM.json
          if-no-files-found: error

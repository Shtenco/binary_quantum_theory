name: q2-first-scalar-effective-action

on:
  push:
    branches: [main]
    paths:
      - 'Q2_FIRST_SCALAR_EFFECTIVE_ACTION.md'
      - 'Q2_COLLECTIVE_SCALAR_CARRIER.md'
      - 'BQG_SCALAR_RESPONSE_TO_MATTER.md'
      - 'CONSERVED_SCALAR_PROBE_CONVENTION.md'
      - 'SCALAR_ADM_DIRAC_REDUCTION.md'
      - 'SCALAR_ADM_WARD_QUOTIENT.md'
      - 'SCALAR_WARD_KERNEL_RESPONSE.md'
      - 'CONNECTED_SCALAR_HISTORY_EXTRACTION.md'
      - 'HAMILTONIAN_CONSTRAINT_TO_EFFECTIVE_ACTION.md'
      - 'q2_scalar_frontier.json'
      - 'physicalization_gates.json'
      - 'scripts/q2_first_scalar_effective_action_gate.py'
      - 'scripts/q2_collective_scalar_carrier_gate.py'
      - 'scripts/q2_scalar_adm_seed_gate.py'
      - 'scripts/scalar_adm_dirac_response_gate.py'
      - 'scripts/scalar_adm_ward_basis_gate.py'
      - 'scripts/scalar_ward_kernel_response_gate.py'
      - 'scripts/scalar_connected_history_extractor_gate.py'
      - 'scripts/scalar_connected_history_to_response_gate.py'
      - 'scripts/conserved_scalar_probe_convention_gate.py'
      - 'scripts/verify_q2_scalar_frontier.py'
      - 'scripts/collective_volume_rg_gate.py'
      - 'scripts/q2_symmetric_block_peter_weyl_growth_gate.py'
      - 'scripts/dual_k5_lapse_cochain_gate.py'
      - '.github/workflows/scalar-connected-history-closure.yml'
      - '.github/workflows/q2-first-scalar-effective-action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Q2_FIRST_SCALAR_EFFECTIVE_ACTION.md'
      - 'Q2_COLLECTIVE_SCALAR_CARRIER.md'
      - 'BQG_SCALAR_RESPONSE_TO_MATTER.md'
      - 'CONSERVED_SCALAR_PROBE_CONVENTION.md'
      - 'SCALAR_ADM_DIRAC_REDUCTION.md'
      - 'SCALAR_ADM_WARD_QUOTIENT.md'
      - 'SCALAR_WARD_KERNEL_RESPONSE.md'
      - 'CONNECTED_SCALAR_HISTORY_EXTRACTION.md'
      - 'HAMILTONIAN_CONSTRAINT_TO_EFFECTIVE_ACTION.md'
      - 'q2_scalar_frontier.json'
      - 'physicalization_gates.json'
      - 'scripts/q2_first_scalar_effective_action_gate.py'
      - 'scripts/q2_collective_scalar_carrier_gate.py'
      - 'scripts/q2_scalar_adm_seed_gate.py'
      - 'scripts/scalar_adm_dirac_response_gate.py'
      - 'scripts/scalar_adm_ward_basis_gate.py'
      - 'scripts/scalar_ward_kernel_response_gate.py'
      - 'scripts/scalar_connected_history_extractor_gate.py'
      - 'scripts/scalar_connected_history_to_response_gate.py'
      - 'scripts/conserved_scalar_probe_convention_gate.py'
      - 'scripts/verify_q2_scalar_frontier.py'
      - 'scripts/collective_volume_rg_gate.py'
      - 'scripts/q2_symmetric_block_peter_weyl_growth_gate.py'
      - 'scripts/dual_k5_lapse_cochain_gate.py'
      - '.github/workflows/scalar-connected-history-closure.yml'
      - '.github/workflows/q2-first-scalar-effective-action.yml'

permissions:
  contents: read

concurrency:
  group: q2-first-scalar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalar-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile scalar frontier sources
        run: |
          python -m py_compile \
            scripts/q2_first_scalar_effective_action_gate.py \
            scripts/q2_collective_scalar_carrier_gate.py \
            scripts/q2_scalar_adm_seed_gate.py \
            scripts/scalar_adm_dirac_response_gate.py \
            scripts/scalar_adm_ward_basis_gate.py \
            scripts/scalar_ward_kernel_response_gate.py \
            scripts/scalar_connected_history_extractor_gate.py \
            scripts/scalar_connected_history_to_response_gate.py \
            scripts/conserved_scalar_probe_convention_gate.py \
            scripts/verify_q2_scalar_frontier.py
      - name: Exact q2 local 1PI shape action and cosmology obstruction
        run: |
          python scripts/q2_first_scalar_effective_action_gate.py \
            --output verification_results/Q2_FIRST_SCALAR_EFFECTIVE_ACTION.json
      - name: Derived collective conformal-volume carrier
        run: |
          python scripts/q2_collective_scalar_carrier_gate.py \
            --output verification_results/Q2_COLLECTIVE_SCALAR_CARRIER.json
      - name: Exact local scalar ADM seed Ward quotient and reduction engine
        run: |
          python scripts/q2_scalar_adm_seed_gate.py \
            --output verification_results/Q2_SCALAR_ADM_SEED.json
          python scripts/scalar_adm_ward_basis_gate.py \
            --output verification_results/SCALAR_ADM_WARD_BASIS.json
          python scripts/scalar_adm_dirac_response_gate.py \
            --output verification_results/SCALAR_ADM_DIRAC_ENGINE.json
          python scripts/scalar_ward_kernel_response_gate.py \
            --output verification_results/SCALAR_WARD_KERNEL_RESPONSE.json
      - name: Exact connected-history extractor and end-to-end scalar consumer pipeline
        run: |
          python scripts/scalar_connected_history_extractor_gate.py \
            --output verification_results/SCALAR_CONNECTED_HISTORY_EXTRACTOR.json
          python scripts/scalar_connected_history_to_response_gate.py \
            --output verification_results/SCALAR_CONNECTED_HISTORY_TO_RESPONSE.json
      - name: Frozen universal conserved external probe convention
        run: |
          python scripts/conserved_scalar_probe_convention_gate.py \
            --output verification_results/CONSERVED_SCALAR_PROBE_CONVENTION.json
      - name: Fail-closed scalar frontier ledger
        run: |
          python scripts/verify_q2_scalar_frontier.py \
            --output verification_results/Q2_SCALAR_FRONTIER_STATUS.json
      - name: Cross-guard exact algebra versus open physical outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path('verification_results', name).read_text())

          shape=load('Q2_FIRST_SCALAR_EFFECTIVE_ACTION.json')
          carrier=load('Q2_COLLECTIVE_SCALAR_CARRIER.json')
          seed=load('Q2_SCALAR_ADM_SEED.json')
          ward=load('SCALAR_ADM_WARD_BASIS.json')
          reduction=load('SCALAR_ADM_DIRAC_ENGINE.json')
          response=load('SCALAR_WARD_KERNEL_RESPONSE.json')
          extractor=load('SCALAR_CONNECTED_HISTORY_EXTRACTOR.json')
          e2e=load('SCALAR_CONNECTED_HISTORY_TO_RESPONSE.json')
          probe=load('CONSERVED_SCALAR_PROBE_CONVENTION.json')
          truth=load('Q2_SCALAR_FRONTIER_STATUS.json')

          assert shape['passed'] is True
          assert carrier['passed'] is True
          assert seed['passed'] is True
          assert ward['passed'] is True
          assert reduction['passed'] is True
          assert response['passed'] is True
          assert extractor['passed'] is True
          assert e2e['passed'] is True
          assert e2e['selftest']['algebraic_pipeline_closed'] is True
          assert e2e['selftest']['remaining_microscopic_input'] == [
              'G_QQ(omega,k)', 'G_Qzeta(omega,k)', 'G_zetazeta(omega,k)'
          ]
          assert probe['passed'] is True
          assert truth['valid'] is True

          assert seed['local_log_volume_1PI']['Gamma_second_at_0'] == '18'
          assert ward['ward_parameter_count'] == 3
          assert reduction['selftest']['pure_gravity_scalar_control']['physical_dimension'] == 0
          assert response['selftest']['tests']['gr_like_static_has_no_omega2_pole'] is True
          assert response['selftest']['tests']['healthy_positive_residue'] is True
          assert response['selftest']['tests']['ghost_negative_residue_detected'] is True
          assert extractor['selftest']['tests']['singular_control_requires_further_reduction'] is True
          assert e2e['selftest']['tests']['healthy_physical_chain_allowed'] is True
          assert e2e['selftest']['tests']['healthy_mass2_two'] is True
          assert e2e['selftest']['tests']['healthy_cs2_one_quarter'] is True
          assert probe['science_status'] == 'FROZEN_EXTERNAL_CONSERVED_PROBE_CONVENTION'

          assert shape['cosmology_outputs']['mu_BQG_a_k'] == 'NOT_DERIVABLE'
          assert shape['cosmology_outputs']['Sigma_BQG_a_k'] == 'NOT_DERIVABLE'
          assert carrier['cosmology_outputs']['rho_hist_a'] == 'OPEN_PHYSICAL'
          assert carrier['cosmology_outputs']['Phi_a_k'] == 'OPEN_PHYSICAL'
          assert carrier['cosmology_outputs']['Psi_a_k'] == 'OPEN_PHYSICAL'
          assert carrier['cosmology_outputs']['mu_BQG_a_k'] == 'OPEN_PHYSICAL'
          assert carrier['cosmology_outputs']['Sigma_BQG_a_k'] == 'OPEN_PHYSICAL'

          algebra=truth['exact_scalar_algebra']
          assert algebra['flat_Ward_parameter_count'] == 3
          assert algebra['connected_history_consumer_pipeline'] == 'FROZEN_GCONN_TO_RESPONSE'
          assert algebra['remaining_microscopic_inputs'] == [
              'G_QQ(omega,k)', 'G_Qzeta(omega,k)', 'G_zetazeta(omega,k)'
          ]
          assert truth['frozen_scalar_interfaces']['PHYSICAL_CONSERVED_MATTER_SOURCE_COUPLING'] == 'frozen'
          assert truth['frozen_scalar_interfaces']['SCALAR_CONNECTED_HISTORY_TO_RESPONSE_PIPELINE'] == 'frozen'
          for status in truth['open_scalar_physical_gates'].values():
              assert status == 'open_physical'
          for status in truth['parent_open_guards'].values():
              assert status == 'open_physical'
          for status in truth['cosmology_outputs'].values():
              assert status == 'OPEN_PHYSICAL'

          print('q2 scalar algebraic pipeline CLOSED; theory-specific connected cumulants remain OPEN: PASS')
          PY
      - name: Upload scalar frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-first-scalar-effective-action-evidence
          path: verification_results/
          if-no-files-found: error

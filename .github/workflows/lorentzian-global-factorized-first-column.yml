name: lorentzian-global-factorized-first-column

on:
  workflow_dispatch:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - 'scripts/peter_weyl_lorentzian_global_hkh_outer_a_worker.py'
      - 'scripts/peter_weyl_lorentzian_global_direct_k_worker.py'
      - 'scripts/peter_weyl_lorentzian_global_factorized_aggregate.py'
      - '.github/workflows/lorentzian-global-factorized-first-column.yml'

permissions:
  contents: read
  actions: read

env:
  ALL_MIDDLE_RUN_ID: '33971440632'
  ALL_MIDDLE_HEAD_SHA: 'd1907fc723517ac405133b23e6add0e816e270a6'

jobs:
  direct-k:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: lorentzian-all-middle-prefixes-input0
          path: all_middle
          github-token: ${{ github.token }}
          run-id: ${{ env.ALL_MIDDLE_RUN_ID }}
      - name: Apply only two globally factorized direct K actions
        run: |
          mkdir -p direct_result
          python scripts/peter_weyl_lorentzian_global_direct_k_worker.py \
            --middle-dir all_middle \
            --middle-run-id $ALL_MIDDLE_RUN_ID \
            --middle-head-sha $ALL_MIDDLE_HEAD_SHA \
            --output direct_result/global_direct_k.json
      - uses: actions/upload-artifact@v4
        with:
          name: lorentzian-global-direct-k-input00
          path: direct_result/global_direct_k.json
          if-no-files-found: error

  hkh:
    strategy:
      fail-fast: false
      matrix:
        outer_a: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: lorentzian-all-middle-prefixes-input0
          path: all_middle
          github-token: ${{ github.token }}
          run-id: ${{ env.ALL_MIDDLE_RUN_ID }}
      - name: Apply four edge-dependent minus-hKh actions
        run: |
          mkdir -p hkh_result
          python scripts/peter_weyl_lorentzian_global_hkh_outer_a_worker.py \
            --middle-dir all_middle \
            --outer-a ${{ matrix.outer_a }} \
            --middle-run-id $ALL_MIDDLE_RUN_ID \
            --middle-head-sha $ALL_MIDDLE_HEAD_SHA \
            --output hkh_result/hkh_outer_a_${{ matrix.outer_a }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: lorentzian-global-hkh-a-${{ matrix.outer_a }}
          path: hkh_result/hkh_outer_a_${{ matrix.outer_a }}.json
          if-no-files-found: error

  aggregate:
    needs: [direct-k, hkh]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: lorentzian-global-direct-k-input00
          path: direct_result
      - uses: actions/download-artifact@v4
        with:
          pattern: lorentzian-global-hkh-a-*
          path: hkh_result
          merge-multiple: true
      - name: Reconstruct factorized fail-closed candidate column
        run: |
          mkdir -p final_result
          python scripts/peter_weyl_lorentzian_global_factorized_aggregate.py \
            --direct direct_result/global_direct_k.json \
            --hkh-glob 'hkh_result/hkh_outer_a_*.json' \
            --output final_result/LORENTZIAN_GLOBAL_FACTORIZED_FIRST_COLUMN_CANDIDATE_INPUT00.json
      - name: Verify candidate cannot enter Pphys
        run: |
          python - <<'PY'
          import json
          p=json.load(open('final_result/LORENTZIAN_GLOBAL_FACTORIZED_FIRST_COLUMN_CANDIDATE_INPUT00.json'))
          assert p['passed'] is True
          assert p['schema']=='BQG_LORENTZIAN_GLOBAL_FACTORIZED_FIRST_COLUMN_CANDIDATE_V1'
          assert p['production_equivalence_certified'] is False
          assert p['physical_projector_eligible'] is False
          assert p['direct_K']['call_count']<=2
          assert sum(x['hKh_call_count'] for x in p['hKh_outer_edges'])<=16
          print('PASS factorized candidate fail-closed',p['science_status'],p['total_operator_calls'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lorentzian-global-factorized-first-column-candidate-input00
          path: final_result/LORENTZIAN_GLOBAL_FACTORIZED_FIRST_COLUMN_CANDIDATE_INPUT00.json
          if-no-files-found: error

name: BQG depth6 [3,2] compact QR probe
on:
  push:
    branches: [research/depth6-s4sign-proof]
    paths:
      - 'mixed_parallel/compress_master_map_qr.py'
      - '.github/workflows/bqg-depth6-32-qr-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qr-shard18:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Download completed raw shard 18 only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: '11184840100'
        run: |
          set -euo pipefail
          mkdir -p input_zip input
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o input_zip/shard18.zip
          unzip -q input_zip/shard18.zip -d input
          test -f input/bqg-mixed-32-shard-18.tar.gz
      - name: Convert persisted master maps to reduced QR evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u mixed_parallel/compress_master_map_qr.py \
            --src input/bqg-mixed-32-shard-18.tar.gz \
            --work qr_probe_work \
            --out bqg-mixed-32-shard-18-qr.pkl.gz \
            --json bqg-mixed-32-shard-18-qr-stats.json \
            --source-run-id 36899125190 \
            --source-artifact-id 11184840100 \
            --source-artifact-digest 'sha256:30c44ee2008b50b06176a97ef4001412603b7cefaa0614cc7ac68b412056b4dc' \
            --engine-git-blob-sha cbbaa80f6b6b61d353458db1fa1f03f824730532
          cat bqg-mixed-32-shard-18-qr-stats.json
          ls -lh bqg-mixed-32-shard-18-qr.pkl.gz
          python - <<'PY'
          import json
          x=json.load(open('bqg-mixed-32-shard-18-qr-stats.json'))
          s=x['compression_stats']
          assert x['kind']=='BQG_MIXED_MASTER_PER_Q_QR'
          assert x['schema_version']==2
          assert x['irrep']=='32' and x['shard']==18 and x['shards']==112
          assert x['assigned_blocks']==1 and x['assigned_columns']==480
          assert s['qr_factor_bytes_uncompressed'] <= s['raw_matrix_bytes'], s
          print('QR_PROBE_PASS', s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-mixed-32-shard-18-compact-qr
          path: |
            bqg-mixed-32-shard-18-qr.pkl.gz
            bqg-mixed-32-shard-18-qr-stats.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

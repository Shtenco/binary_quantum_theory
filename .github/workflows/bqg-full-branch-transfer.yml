name: BQG full branch transfer matrix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_full_branch_transfer_matrix.py'
      - '.github/workflows/bqg-full-branch-transfer.yml'
  workflow_dispatch:

jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        s2: [3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute full branch-transfer matrix
        run: |
          mkdir -p verification_results
          python scripts/bqg_full_branch_transfer_matrix.py \
            --s2 ${{ matrix.s2 }} \
            --output verification_results/BQG_FULL_BRANCH_TRANSFER_S2_${{ matrix.s2 }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-full-branch-transfer-s2-${{ matrix.s2 }}
          path: verification_results/BQG_FULL_BRANCH_TRANSFER_S2_${{ matrix.s2 }}.json
          retention-days: 30

name: joint-cutoff-diagonal

on:
  push:
    paths:
      - 'scripts/joint_cutoff_diagonal_gate.py'
      - 'JOINT_CUTOFF_DIAGONAL_CERTIFICATE.md'
      - 'BCQG_CORE_CANDIDATE_V1.md'
  pull_request:
    paths:
      - 'scripts/joint_cutoff_diagonal_gate.py'
      - 'JOINT_CUTOFF_DIAGONAL_CERTIFICATE.md'
      - 'BCQG_CORE_CANDIDATE_V1.md'
      - 'theory_gates.json'
      - 'THEORY_STATUS.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile scripts/joint_cutoff_diagonal_gate.py
      - name: Canonical simultaneous-cutoff gate
        run: |
          python scripts/joint_cutoff_diagonal_gate.py \
            --levels 40 \
            --output verification_results/JOINT_CUTOFF_DIAGONAL.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-cutoff-diagonal
          path: verification_results/JOINT_CUTOFF_DIAGONAL.json
          if-no-files-found: warn

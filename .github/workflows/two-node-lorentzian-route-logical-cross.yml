name: two-node-lorentzian-route-logical-cross

on:
  push:
    paths:
      - 'scripts/two_node_lorentzian_route_logical_cross_gate.py'
      - 'scripts/operator_first_two_node_route_hda_gate.py'
      - 'verification_results/LORENTZIAN_REPO_SIGN.json'
      - '.github/workflows/two-node-lorentzian-route-logical-cross.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/two_node_lorentzian_route_logical_cross_gate.py
      - name: Compute signed 4x4 shared-route cross
        run: |
          python scripts/two_node_lorentzian_route_logical_cross_gate.py \
            --n-theta 32768 \
            --output verification_results/TWO_NODE_LORENTZIAN_ROUTE_LOGICAL_CROSS.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-node-lorentzian-route-logical-cross
          path: verification_results/TWO_NODE_LORENTZIAN_ROUTE_LOGICAL_CROSS.json
          if-no-files-found: warn

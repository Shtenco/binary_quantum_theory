name: physicalization-l1-metric-depth2-pilot

on:
  push:
    branches:
      - research/physicalization-l1-depth2-metric
    paths:
      - '.github/workflows/physicalization-l1-metric-depth2-pilot.yml'
  workflow_dispatch:

# This experimental monolithic branch has been superseded by the exact
# 72-shard production calculation on research/bcqg-core-candidate-v1.
# A push here must cancel any stale historical monolithic run rather than
# consume the only hosted runner for an obsolete calculation.
concurrency:
  group: superseded-physicalization-l1-metric-depth2-pilot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Superseded calculation guard
        run: |
          echo 'SUPERSEDED: use collective-l1-block-e-krylov on research/bcqg-core-candidate-v1'
          echo 'No scientific result is produced by this retired monolithic workflow.'

name: tetrahedral-charged-volume-audit

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'TETRAHEDRAL_CHARGED_VOLUME_UNIQUENESS.md'
      - 'scripts/tetrahedral_volume_backend.py'
      - 'scripts/tetrahedral_charged_volume_uniqueness_gate.py'
      - 'scripts/tetrahedral_volume_s4_covariance_gate.py'
      - 'scripts/tetrahedral_charged_volume_audit_gate.py'
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - '.github/workflows/tetrahedral-charged-volume-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/tetrahedral_volume_backend.py
          python -m py_compile scripts/tetrahedral_charged_volume_uniqueness_gate.py
          python -m py_compile scripts/tetrahedral_volume_s4_covariance_gate.py
          python -m py_compile scripts/tetrahedral_charged_volume_audit_gate.py
      - name: Unique S4 sign-representation completion
        run: python scripts/tetrahedral_charged_volume_uniqueness_gate.py --output verification_results/TETRAHEDRAL_CHARGED_VOLUME_UNIQUENESS.json
      - name: Full magnetic-tensor S4 covariance
        run: python scripts/tetrahedral_volume_s4_covariance_gate.py --output verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE.json
      - name: Physical charged-volume covariance and Euclidean-invariance audit
        run: python scripts/tetrahedral_charged_volume_audit_gate.py --output verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json
      - name: Guard forced-correction semantics
        run: |
          python - <<'PY'
          import json
          u=json.load(open('verification_results/TETRAHEDRAL_CHARGED_VOLUME_UNIQUENESS.json'))
          s=json.load(open('verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE.json'))
          d=json.load(open('verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json'))
          assert u['passed'] and u['constraint_rank']==3 and u['sign_eigenspace_nullity']==1
          assert u['projective_defect_vs_alternating_vector']<1e-12
          assert s['passed'] and s['maximum_relative_covariance_defect']<1e-12
          assert d['passed']
          assert d['checks']['charged_q123_preferred_leg_negative_control']
          assert d['checks']['gauss_absolute_volume_normalization_preserved']
          assert d['checks']['K5_H_E_sine_exactly_preserved']
          assert d['checks']['16cell_H_E_sine_exactly_preserved']
          assert d['checks']['old_CV_slot_asymmetry_detected']
          assert d['checks']['tetra_CV_all_slots_nonzero']
          assert d['checks']['tetra_CV_slot_covariance_restored']
          assert d['tetra_CV_slot_norm_spread']<1e-12
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetrahedral-charged-volume-audit
          path: |
            verification_results/TETRAHEDRAL_CHARGED_VOLUME_UNIQUENESS.json
            verification_results/TETRAHEDRAL_VOLUME_S4_COVARIANCE.json
            verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT.json
          if-no-files-found: error

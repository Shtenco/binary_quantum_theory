name: scalar-master-baseline

on:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - .github/workflows/scalar-master-baseline.yml
      - scripts/peter_weyl_master_32_gate.py
      - scripts/peter_weyl_logical_anisotropy_gate.py
  pull_request:
    paths:
      - .github/workflows/scalar-master-baseline.yml
      - scripts/peter_weyl_master_32_gate.py
      - scripts/peter_weyl_logical_anisotropy_gate.py

permissions:
  contents: write

jobs:
  euclidean-master-32d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt

      - name: Run existing full 32D Euclidean logical Gram/master baseline
        run: |
          mkdir -p results
          python scripts/peter_weyl_master_32_gate.py \
            --output results/peter_weyl_euclidean_master_32_baseline.json

      - name: Publish deterministic baseline on research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/physical-scalar-kernel-dynamics'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/peter_weyl_euclidean_master_32_baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged"
          else
            git commit -m "Record Euclidean 32D logical master baseline [skip ci]"
            git push origin HEAD:research/physical-scalar-kernel-dynamics
          fi

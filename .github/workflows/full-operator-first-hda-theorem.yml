name: full-operator-first-hda-theorem

on:
  push:
    paths:
      - 'FULL_OPERATOR_FIRST_HDA_CERTIFICATE.md'
      - 'scripts/full_operator_first_hda_theorem_gate.py'
      - 'verification_results/PETER_WEYL_OPERATOR_ROUTE_SPINCHANGED_BLOCKS.json'
      - '.github/workflows/full-operator-first-hda-theorem.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic dependency
        run: python -m pip install sympy
      - name: Syntax
        run: python -m py_compile scripts/full_operator_first_hda_theorem_gate.py
      - name: Verify signed operator-first full-HDA asymptotic composition
        run: |
          python scripts/full_operator_first_hda_theorem_gate.py \
            --route-evidence verification_results/PETER_WEYL_OPERATOR_ROUTE_SPINCHANGED_BLOCKS.json \
            --output verification_results/FULL_OPERATOR_FIRST_HDA_THEOREM.json
      - name: Upload certificate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-operator-first-hda-theorem
          path: verification_results/FULL_OPERATOR_FIRST_HDA_THEOREM.json
          if-no-files-found: warn

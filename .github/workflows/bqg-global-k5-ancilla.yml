name: BQG global K5 ancilla symmetry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_global_k5_ancilla_symmetry_gate.py'
      - '.github/workflows/bqg-global-k5-ancilla.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Test global K5 ancilla symmetry line
        run: python scripts/bqg_global_k5_ancilla_symmetry_gate.py

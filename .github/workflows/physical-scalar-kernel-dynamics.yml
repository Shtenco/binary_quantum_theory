name: physical-scalar-kernel-dynamics

on:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - PETER_WEYL_LORENTZIAN_LOGICAL_RETURN_PREREGISTRATION.md
      - PHYSICAL_SCALAR_KERNEL_DEPENDENCY_GRAPH.md
      - scripts/peter_weyl_lorentzian_epsilon_logical_return_gate.py
      - .github/workflows/physical-scalar-kernel-dynamics.yml
  pull_request:
    paths:
      - PETER_WEYL_LORENTZIAN_LOGICAL_RETURN_PREREGISTRATION.md
      - PHYSICAL_SCALAR_KERNEL_DEPENDENCY_GRAPH.md
      - scripts/peter_weyl_lorentzian_epsilon_logical_return_gate.py
      - .github/workflows/physical-scalar-kernel-dynamics.yml

permissions:
  contents: write

jobs:
  epsilon-lorentzian-logical-return:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt

      - name: Run preregistered full epsilon Lorentzian logical-return witness
        run: |
          mkdir -p results
          python scripts/peter_weyl_lorentzian_epsilon_logical_return_gate.py \
            --source-node 0 \
            --input-index 0 \
            --output results/peter_weyl_lorentzian_epsilon_logical_return.json

      - name: Publish deterministic result on research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/physical-scalar-kernel-dynamics'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/peter_weyl_lorentzian_epsilon_logical_return.json
          if git diff --cached --quiet; then
            echo "Result unchanged"
          else
            git commit -m "Record epsilon Lorentzian logical-return result [skip ci]"
            git push origin HEAD:research/physical-scalar-kernel-dynamics
          fi

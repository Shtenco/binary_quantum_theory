name: Qwen 1.5B local courier
on:
  push:
    branches: [exp/qwen15-local-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download Qwen2.5 1.5B GGUF
        run: |
          mkdir -p payload/model_chunks
          curl -L --fail --retry 8 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true" \
            -o payload/qwen2.5-1.5b-instruct-q4_k_m.gguf
          stat -c '%s' payload/qwen2.5-1.5b-instruct-q4_k_m.gguf | tee payload/model_size.txt
          sha256sum payload/qwen2.5-1.5b-instruct-q4_k_m.gguf | tee payload/model_sha256.txt
          split -b 50M -d -a 2 payload/qwen2.5-1.5b-instruct-q4_k_m.gguf payload/model_chunks/qwen15.gguf.part.
          ls -lh payload/model_chunks
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen15-manifest
          path: |
            payload/model_size.txt
            payload/model_sha256.txt
          retention-days: 3

      - name: Upload Qwen15 chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: qwen15-chunk-00
          path: payload/model_chunks/qwen15.gguf.part.00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload Qwen15 chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: qwen15-chunk-01
          path: payload/model_chunks/qwen15.gguf.part.01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3


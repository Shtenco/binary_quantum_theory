name: BQG depth6 [3,2] targeted keymeta retry (QUARANTINED)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# QUARANTINE NOTE
# The previous implementation reconstructed shard assignments by rerunning the
# frozen github_mixed_master_shard.py bootstrap, which enumerates the depth-6
# shell/S5 orbits and calls exact_mult/Jucys machinery. Those quantities are
# immutable closed inputs for the [3,2] recovery path and must not be recomputed.
# Existing artifacts from run 36930607904 are therefore diagnostic only and
# MUST NOT be admitted to canonical actual-q coverage.
#
# Canonical retries must be ledger-driven from persisted/frozen per-orbit
# assignment data (orbit_index, rep, m, coord_dim/proxy or an exact frozen
# 112-shard assignment), and then execute only the numerical master-map step.

jobs:
  quarantined:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'QUARANTINED: noncanonical bootstrap-based retry is disabled.'
          exit 1

name: lorentzian-superposition-linearity

on:
  push:
    paths:
      - 'scripts/peter_weyl_lorentzian_superposition_gate.py'
      - 'scripts/peter_weyl_lorentzian_logical_projection_gate.py'
      - 'scripts/peter_weyl_lorentzian_gauss_action_gate.py'
      - '.github/workflows/lorentzian-superposition-linearity.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_superposition_gate.py
      - name: Verify exact superposition linearity at reduced safe cutoff
        run: |
          python scripts/peter_weyl_lorentzian_superposition_gate.py \
            --jmax2 5 \
            --output verification_results/PETER_WEYL_LORENTZIAN_SUPERPOSITION_LINEARITY.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-superposition-linearity
          path: verification_results/PETER_WEYL_LORENTZIAN_SUPERPOSITION_LINEARITY.json
          if-no-files-found: warn

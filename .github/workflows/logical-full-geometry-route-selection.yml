name: logical-full-geometry-route-selection

on:
  push:
    paths:
      - 'scripts/logical_full_geometry_route_selection_gate.py'
      - 'scripts/two_node_lorentzian_route_logical_cross_gate.py'
      - 'LOGICAL_FULL_GEOMETRY_ROUTE_SELECTION.md'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - 'theory_gates.json'
      - 'verification_results/LORENTZIAN_REPO_SIGN.json'
      - '.github/workflows/logical-full-geometry-route-selection.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/two_node_lorentzian_route_logical_cross_gate.py
          python -m py_compile scripts/logical_full_geometry_route_selection_gate.py
      - name: Verify physical-sine projected full G x R selection rule
        run: |
          python scripts/logical_full_geometry_route_selection_gate.py \
            --n-theta 32768 \
            --output verification_results/LOGICAL_FULL_GEOMETRY_ROUTE_SELECTION.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-full-geometry-route-selection
          path: verification_results/LOGICAL_FULL_GEOMETRY_ROUTE_SELECTION.json
          if-no-files-found: warn

name: pl-16cell-operator-route

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - 'scripts/pl_16cell_operator_route_gate.py'
      - 'scripts/operator_route_sparse_fourier.py'
      - '.github/workflows/pl-16cell-route.yml'
  workflow_dispatch:

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/pl_16cell_operator_route_gate.py
      - name: Independent-habitat route HDA
        run: python scripts/pl_16cell_operator_route_gate.py --output verification_results/PL_16CELL_OPERATOR_ROUTE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl16-operator-route
          path: verification_results/PL_16CELL_OPERATOR_ROUTE.json
          if-no-files-found: warn

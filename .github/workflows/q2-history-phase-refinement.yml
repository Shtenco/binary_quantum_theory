name: q2-history-phase-refinement

on:
  push:
    branches:
      - research/q2-history-phase-refinement-winding
    paths:
      - 'Q2_HISTORY_PHASE_REFINEMENT_AND_WINDING.md'
      - 'Q2_MINIMAL_REVERSIBLE_HISTORY_DILATION.md'
      - 'Q2_C4_RATIONAL_PHASE_DENSITY_TO_U1.md'
      - 'Q2_WINDING_DUALITY_AND_PHASE_CHARACTERS.md'
      - 'Q2_HISTORY_CHARACTER_PROJECTOR_AUDIT.md'
      - 'Q2_GEOMETRY_HISTORY_ORIENTATION_LOCKING.md'
      - 'Q2_ORIENTATION_RESOLVED_HISTORY_LIFT.md'
      - 'scripts/q2_history_phase_refinement_winding_gate.py'
      - 'scripts/q2_minimal_reversible_history_dilation_gate.py'
      - 'scripts/q2_rational_phase_dense_u1_gate.py'
      - 'scripts/q2_winding_phase_character_gate.py'
      - 'scripts/q2_history_character_projector_audit_gate.py'
      - 'scripts/q2_geometry_history_orientation_lock_gate.py'
      - 'scripts/q2_orientation_resolved_history_lift_gate.py'
      - '.github/workflows/q2-history-phase-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-history-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Recompute exact q=2 graph-link factorization input
        run: |
          mkdir -p verification_results
          python scripts/q2_graphlink_peter_weyl_gate.py \
            --output verification_results/Q2_GRAPHLINK_PETER_WEYL.json
      - name: Recompute exact q=2 recursive causal length input
        run: |
          python scripts/q2_dimension3_fixed_point_gate.py \
            --max-generation 10 \
            --output verification_results/Q2_DIMENSION3_FIXED_POINT.json
      - name: Prove minimal reversible q=2 history dilation
        run: |
          python scripts/q2_minimal_reversible_history_dilation_gate.py \
            --output verification_results/Q2_MINIMAL_REVERSIBLE_HISTORY_DILATION.json
      - name: Run history phase-refinement / winding frontier gate
        run: |
          python scripts/q2_history_phase_refinement_winding_gate.py \
            --graphlink-json verification_results/Q2_GRAPHLINK_PETER_WEYL.json \
            --dimension-json verification_results/Q2_DIMENSION3_FIXED_POINT.json \
            --max-generation 10 \
            --output verification_results/Q2_HISTORY_PHASE_REFINEMENT_WINDING.json
      - name: Run direct rational phase density to U1 gate
        run: |
          python scripts/q2_rational_phase_dense_u1_gate.py \
            --output verification_results/Q2_RATIONAL_PHASE_DENSE_U1.json
      - name: Run winding composition to phase-character gate
        run: |
          python scripts/q2_winding_phase_character_gate.py \
            --history-json verification_results/Q2_HISTORY_PHASE_REFINEMENT_WINDING.json \
            --output verification_results/Q2_WINDING_PHASE_CHARACTER.json
      - name: Audit history character projectors and group averaging
        run: |
          python scripts/q2_history_character_projector_audit_gate.py \
            --output verification_results/Q2_HISTORY_CHARACTER_PROJECTOR_AUDIT.json
      - name: Test geometry-history orientation locking channel
        run: |
          python scripts/q2_geometry_history_orientation_lock_gate.py \
            --output verification_results/Q2_GEOMETRY_HISTORY_ORIENTATION_LOCK.json
      - name: Prove minimal orientation-resolved reversible history lift
        run: |
          python scripts/q2_orientation_resolved_history_lift_gate.py \
            --output verification_results/Q2_ORIENTATION_RESOLVED_HISTORY_LIFT.json
      - name: Enforce claim boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('verification_results/Q2_HISTORY_PHASE_REFINEMENT_WINDING.json'))
          assert p['passed'] is True
          assert p['physical_frontier']['history_to_winding'].startswith('EXACT')
          assert p['physical_frontier']['C4_to_C8_history_graph'].startswith('EXACT')
          assert p['physical_frontier']['instantaneous_5_state_Hilbert_to_C8'].startswith('NEGATIVE')
          assert p['physical_frontier']['C8_to_C16_to_U1'].startswith('CONDITIONAL')
          assert p['physical_frontier']['phase_causal_locking'] == 'OPEN_PHYSICAL'
          q=json.load(open('verification_results/Q2_MINIMAL_REVERSIBLE_HISTORY_DILATION.json'))
          assert q['passed'] is True
          assert q['forced_minimum_history_channel_dimension'] == 4
          assert q['minimal_reversible_history_dimension'] == 8
          assert q['history_unitary_order'] == 8
          r=json.load(open('verification_results/Q2_RATIONAL_PHASE_DENSE_U1.json'))
          assert r['passed'] is True
          assert 'not necessary' in r['senior_correction']
          c=json.load(open('verification_results/Q2_WINDING_PHASE_CHARACTER.json'))
          assert c['passed'] is True
          assert c['checks']['Z_character_composition_law'] is True
          assert c['checks']['orientation_reversal_is_inverse_transpose_conjugation'] is True
          assert c['gaussian_integer_unit_circle'] == [[-1,0],[0,-1],[0,1],[1,0]]
          a=json.load(open('verification_results/Q2_HISTORY_CHARACTER_PROJECTOR_AUDIT.json'))
          assert a['passed'] is True
          assert a['checks']['untwisted_group_average_is_trivial_projector'] is True
          assert a['checks']['untwisted_group_average_kills_all_nontrivial_characters'] is True
          assert a['checks']['universal_cover_character_window_norm_diverges'] is True
          assert 'pure gauge' in a['exact_no_go']
          o=json.load(open('verification_results/Q2_GEOMETRY_HISTORY_ORIENTATION_LOCK.json'))
          assert o['passed'] is True
          assert o['checks']['orientation_lock_is_combined_reflection_even'] is True
          assert o['checks']['orientation_even_history_kernel_keeps_conjugate_degeneracy'] is True
          assert o['checks']['ordinary_group_average_kills_orientation_lock'] is True
          assert 'does not derive its coefficient' in o['microscopic_frontier']
          m=json.load(open('verification_results/Q2_ORIENTATION_RESOLVED_HISTORY_LIFT.json'))
          assert m['passed'] is True
          assert m['valid_deterministic_direction_pairs_splus_sminus'] == [[1,-1],[-1,1]]
          assert m['checks']['sine_part_is_exact_geometry_history_lock'] is True
          assert m['checks']['gray_to_binary_kernel_is_frozen_q2_Hamming_adjacency'] is True
          assert m['exact_coefficients']['g_YC_Hamming_orientation_unresolved'] == '0'
          assert m['exact_coefficients']['g_YC_minimal_one_tick_sine_normalization'] == '1'
          assert m['exact_coefficients']['g_YC_gravity'] == 'OPEN_PHYSICAL'
          assert 'NOT' in m['senior_boundary'] or 'open' in m['senior_boundary'].lower()
          print('claim-boundary guards: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: q2-history-phase-refinement-evidence
          path: verification_results/*.json

name: euclidean-k1-span

on:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - PETER_WEYL_EUCLIDEAN_K1_SPAN_PREREGISTRATION.md
      - scripts/peter_weyl_euclidean_k1_span_gate.py
      - .github/workflows/euclidean-k1-span.yml
  pull_request:
    paths:
      - PETER_WEYL_EUCLIDEAN_K1_SPAN_PREREGISTRATION.md
      - scripts/peter_weyl_euclidean_k1_span_gate.py
      - .github/workflows/euclidean-k1-span.yml

jobs:
  euclidean-k1-outgoing-span:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compute 160-column first outgoing Gram
        run: |
          python scripts/peter_weyl_euclidean_k1_span_gate.py \
            --output verification_results/PETER_WEYL_EUCLIDEAN_K1_SPAN.json
      - name: Upload deterministic K1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclidean-k1-span
          path: verification_results/PETER_WEYL_EUCLIDEAN_K1_SPAN.json
          if-no-files-found: warn

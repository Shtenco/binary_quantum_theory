name: peter-weyl-master-32

on:
  push:
    branches:
      - research/pw-master-32
  pull_request:
    paths:
      - 'scripts/peter_weyl_master_32_gate.py'
      - 'scripts/peter_weyl_logical_anisotropy_gate.py'
      - '.github/workflows/peter-weyl-master-32.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_master_32_gate.py
      - name: Full 32D master normalization
        run: |
          python scripts/peter_weyl_master_32_gate.py \
            --output verification_results/PETER_WEYL_MASTER_32.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-master-32-evidence
          path: verification_results/PETER_WEYL_MASTER_32.json

name: peter-weyl-spin-parity-master

on:
  push:
    branches:
      - research/pw-spin-parity-master
  pull_request:
    paths:
      - 'scripts/peter_weyl_spin_parity_master_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/peter-weyl-spin-parity-master.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_spin_parity_master_gate.py
      - name: Spin-parity and master-constraint control
        run: |
          python scripts/peter_weyl_spin_parity_master_gate.py \
            --output verification_results/PETER_WEYL_SPIN_PARITY_MASTER.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-spin-parity-master-evidence
          path: verification_results/PETER_WEYL_SPIN_PARITY_MASTER.json

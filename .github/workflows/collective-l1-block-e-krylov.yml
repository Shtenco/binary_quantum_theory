name: collective-l1-block-e-krylov

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/collective_l1_metric_edge_depth2_worker.py'
      - 'scripts/collective_l1_metric_edge_depth2_collect.py'
      - 'scripts/collective_barycentric_E_boundary_support_gate.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - 'scripts/pl_dual_complex.py'
      - '.github/workflows/collective-l1-block-e-krylov.yml'
  workflow_dispatch:

jobs:
  metric-orbit-columns:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        edge_index: [0,1,5]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/collective_l1_metric_edge_depth2_worker.py
      - name: Exact full-E coarse-edge source and block second hit
        run: |
          mkdir -p out
          python scripts/collective_l1_metric_edge_depth2_worker.py \
            --edge-index ${{ matrix.edge_index }} \
            --out-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-l1-metric-depth2-${{ matrix.edge_index }}
          path: out/
          if-no-files-found: error
          compression-level: 6

  collect:
    needs: metric-orbit-columns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: collective-l1-metric-depth2-*
          path: columns
          merge-multiple: true
      - name: Exact three-orbit depth-two metric response
        run: |
          python scripts/collective_l1_metric_edge_depth2_collect.py \
            --root columns \
            --output verification_results/L1_METRIC_EDGE_DEPTH2_KRYLOV.json
      - name: Guard scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('verification_results/L1_METRIC_EDGE_DEPTH2_KRYLOV.json'))
          assert d['passed'] is True
          assert d['science_status']=='L1_METRIC_EDGE_DEPTH2_KRYLOV'
          assert d['checks']['S4_three_orbit_consistency']
          assert d['checks']['nonnegative_depth2_variance_with_tolerance']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-l1-metric-edge-depth2-krylov
          path: verification_results/L1_METRIC_EDGE_DEPTH2_KRYLOV.json
          if-no-files-found: error

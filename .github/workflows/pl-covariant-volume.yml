name: pl-covariant-volume

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - 'scripts/pl_covariant_backend.py'
      - 'scripts/pl_covariant_volume_leg_gate.py'
      - '.github/workflows/pl-covariant-volume.yml'
  workflow_dispatch:

jobs:
  covariant-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/pl_covariant_backend.py scripts/pl_covariant_volume_leg_gate.py
      - name: Exact PL covariant volume backend regression
        run: python scripts/pl_covariant_volume_leg_gate.py --output verification_results/PL_COVARIANT_VOLUME_LEG.json
      - name: Guard charged representation content
        run: |
          python - <<'PY'
          import json
          d=json.load(open('verification_results/PL_COVARIANT_VOLUME_LEG.json'))
          assert d['passed']
          assert d['K5_reduction_relative_error'] < 1e-10
          assert d['sixteen_cell']['two_hit_identity_error'] < 1e-10
          assert d['sixteen_cell']['max_charged_volume_basis_leakage'] < 1e-10
          assert d['sixteen_cell']['C_J_greater_than_1_fraction'] < 1e-20
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-covariant-volume
          path: verification_results/PL_COVARIANT_VOLUME_LEG.json
          if-no-files-found: error

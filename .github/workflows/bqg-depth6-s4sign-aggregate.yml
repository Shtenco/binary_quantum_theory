name: BQG depth6 S4-sign aggregate
on:
  workflow_run:
    workflows: ["BQG depth6 S4-sign proof shards v2"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: pip install --disable-pip-version-check numpy sympy

      - name: Unpack exact BQG proof bundle
        run: |
          mkdir -p proof_parallel/runtime
          base64 -d proof_parallel/bqg_s4sign_bundle.tar.gz.b64 | tar xz -C proof_parallel/runtime

      - name: Download all v2 shard artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bqg-s4sign-v2-shard-*
          path: proof_parallel/downloaded
          merge-multiple: true

      - name: Normalize artifact filenames for aggregator
        run: |
          set -euo pipefail
          for f in proof_parallel/downloaded/bqg-s4sign-v2-shard-*.tar.gz; do
            base="$(basename "$f")"
            mv "$f" "proof_parallel/downloaded/${base/bqg-s4sign-v2-shard-/bqg-s4sign-shard-}"
          done
          test "$(find proof_parallel/downloaded -name 'bqg-s4sign-shard-*.tar.gz' | wc -l)" -eq 128

      - name: Verify full coverage and run fail-closed global peeling
        env:
          PYTHONPATH: ${{ github.workspace }}/proof_parallel/runtime
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u aggregate_tools/bqg_s4sign_aggregate.py \
            --artifacts proof_parallel/downloaded \
            --expected-shards 128 \
            --work proof_parallel/aggregate_work \
            --out proof_parallel/bqg_depth6_s4sign_distributed_certificate.json

      - name: Upload final certificate
        uses: actions/upload-artifact@v4
        with:
          name: bqg-depth6-s4sign-final-certificate
          path: proof_parallel/bqg_depth6_s4sign_distributed_certificate.json
          retention-days: 14

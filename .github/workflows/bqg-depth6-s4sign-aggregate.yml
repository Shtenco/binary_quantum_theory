name: BQG depth6 S4-sign aggregate
on:
  workflow_run:
    workflows: ["BQG depth6 S4-sign proof shards v2"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main orchestration
        uses: actions/checkout@v4

      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
          path: proofsrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: pip install --disable-pip-version-check numpy sympy

      - name: Unpack exact BQG proof bundle
        run: |
          mkdir -p proof_parallel/runtime
          base64 -d proofsrc/proof_parallel/bqg_s4sign_bundle.tar.gz.b64 | tar xz -C proof_parallel/runtime

      - name: Download all 128 v2 shard artifacts with pagination
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/download_workflow_artifacts_paginated.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --prefix "bqg-s4sign-v2-shard-" \
            --expected 128 \
            --out proof_parallel/downloaded

      - name: Normalize artifact filenames for diagnostic aggregator
        run: |
          set -euo pipefail
          mkdir -p proof_parallel/normalized
          find proof_parallel/downloaded -type f -name 'bqg-s4sign-v2-shard-*.tar.gz' -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              cp "$f" "proof_parallel/normalized/${base/bqg-s4sign-v2-shard-/bqg-s4sign-shard-}"
            done
          test "$(find proof_parallel/normalized -name 'bqg-s4sign-shard-*.tar.gz' | wc -l)" -eq 128

      - name: Verify full coverage and run fail-closed streaming global peeling
        env:
          PYTHONPATH: ${{ github.workspace }}/proof_parallel/runtime
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u proof_tools/bqg_s4sign_aggregate_streaming.py \
            --artifacts proof_parallel/normalized \
            --expected-shards 128 \
            --work proof_parallel/aggregate_work \
            --out proof_parallel/bqg_depth6_s4sign_distributed_certificate.json

      - name: Upload final certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-depth6-s4sign-h0-diagnostic
          path: proof_parallel/bqg_depth6_s4sign_distributed_certificate.json
          retention-days: 14

      - name: Enforce current master-aware frontier semantics
        run: |
          python scripts/verify_depth6_frontier.py
          python - <<'PY'
          import json
          p='proof_parallel/bqg_depth6_s4sign_distributed_certificate.json'
          x=json.load(open(p))
          print('S4SIGN_H0_DIAGNOSTIC_STATUS', x.get('status'))
          print('IMPORTANT: H0 diagnostic is not a master-kernel certificate.')
          print('The canonical master frontier is depth6_frontier.json.')
          PY

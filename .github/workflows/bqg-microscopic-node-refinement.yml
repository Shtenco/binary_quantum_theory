name: BQG microscopic node refinement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_microscopic_node_refinement_gate.py'
      - '.github/workflows/bqg-microscopic-node-refinement.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute microscopic q2 node refinement
        run: |
          mkdir -p verification_results
          python scripts/bqg_microscopic_node_refinement_gate.py \
            --output verification_results/BQG_MICROSCOPIC_NODE_REFINEMENT.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-microscopic-node-refinement
          path: verification_results/BQG_MICROSCOPIC_NODE_REFINEMENT.json
          retention-days: 30

name: logical-anisotropy-regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/peter_weyl_logical_anisotropy_gate.py'
      - 'scripts/logical_route_metric_operator_gate.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - 'scripts/peter_weyl_zeroaware_volume_migration_experiment.py'
      - '.github/workflows/logical-anisotropy-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/peter_weyl_logical_anisotropy_gate.py'
      - 'scripts/logical_route_metric_operator_gate.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - 'scripts/peter_weyl_zeroaware_volume_migration_experiment.py'
      - '.github/workflows/logical-anisotropy-regression.yml'

permissions:
  contents: read

concurrency:
  group: logical-anisotropy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-anisotropy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/peter_weyl_logical_anisotropy_gate.py
          python -m py_compile scripts/logical_route_metric_operator_gate.py
      - name: Logical route flux-metric ordering control
        run: python scripts/logical_route_metric_operator_gate.py --output verification_results/LOGICAL_ROUTE_METRIC_OPERATOR.json
      - name: Peter-Weyl logical anisotropy return kernel
        run: python scripts/peter_weyl_logical_anisotropy_gate.py --output verification_results/PETER_WEYL_LOGICAL_ANISOTROPY.json
      - name: Upload anisotropy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-anisotropy-evidence
          path: verification_results/
          if-no-files-found: warn

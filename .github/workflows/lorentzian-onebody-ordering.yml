name: lorentzian-onebody-ordering

on:
  push:
    paths:
      - 'verification_results/PETER_WEYL_LORENTZIAN_ENVTRACE_ORBIT.json'
      - 'scripts/peter_weyl_lorentzian_onebody_ordering_gate.py'
      - 'PETER_WEYL_LORENTZIAN_ENVTRACE_RESULT.md'
  pull_request:
    paths:
      - 'verification_results/PETER_WEYL_LORENTZIAN_ENVTRACE_ORBIT.json'
      - 'scripts/peter_weyl_lorentzian_onebody_ordering_gate.py'
      - 'PETER_WEYL_LORENTZIAN_ENVTRACE_RESULT.md'
      - 'THEORY_STATUS.md'
      - 'theory_gates.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_onebody_ordering_gate.py
      - name: Audit frozen raw one-body ordering fork
        run: |
          python scripts/peter_weyl_lorentzian_onebody_ordering_gate.py \
            --output verification_results/PETER_WEYL_LORENTZIAN_ONEBODY_ORDERING.json
      - name: Upload ordering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-onebody-ordering
          path: verification_results/PETER_WEYL_LORENTZIAN_ONEBODY_ORDERING.json
          if-no-files-found: warn

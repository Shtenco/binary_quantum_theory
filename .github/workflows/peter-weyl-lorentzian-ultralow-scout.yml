name: peter-weyl-lorentzian-ultralow-scout
on:
  push:
    branches: [research/pw-lorentzian-ultralow-scout]
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Jmax=1 single-triple scout
        run: python scripts/peter_weyl_lorentzian_ultralow_scout.py --output verification_results/PETER_WEYL_LORENTZIAN_ULTRALOW_SCOUT.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-ultralow-scout-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_ULTRALOW_SCOUT.json

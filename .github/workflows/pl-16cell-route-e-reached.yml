name: pl-16cell-route-e-reached

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - 'scripts/pl_16cell_operator_route_E_reached_gate.py'
      - '.github/workflows/pl-16cell-route-e-reached.yml'
  workflow_dispatch:

jobs:
  exhaustive-route:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/pl_16cell_operator_route_E_reached_gate.py
      - name: Exhaust all E-reached fixed-spin route blocks
        run: python scripts/pl_16cell_operator_route_E_reached_gate.py --output verification_results/PL_16CELL_ROUTE_E_REACHED.json
      - name: Guard exhaustive scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('verification_results/PL_16CELL_ROUTE_E_REACHED.json'))
          assert d['passed']
          assert d['distinct_fixed_spin_sectors']==26
          assert d['minimum_symbol_eigenvalue']>-1e-10
          assert d['max_endpoint_defect']<2e-5
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pl-16cell-route-e-reached
          path: verification_results/PL_16CELL_ROUTE_E_REACHED.json
          if-no-files-found: error

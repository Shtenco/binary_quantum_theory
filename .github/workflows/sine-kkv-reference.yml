name: sine-kkv-reference

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sine-kkv-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-triple:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_sine_ordered_triple_gate.py
      - name: Physical ordered K_sine-K_sine-V reference
        id: triple
        continue-on-error: true
        run: |
          python scripts/peter_weyl_lorentzian_sine_ordered_triple_gate.py \
            --output verification_results/PETER_WEYL_SINE_ORDERED_TRIPLE.json
      - name: Upload reference triple
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sine-kkv-reference
          path: verification_results/PETER_WEYL_SINE_ORDERED_TRIPLE.json
          if-no-files-found: warn
      - name: Enforce reference triple
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('verification_results/PETER_WEYL_SINE_ORDERED_TRIPLE.json')
          if not p.is_file():
              raise SystemExit('sine ordered triple JSON missing')
          d=json.loads(p.read_text())
          print(json.dumps(d,indent=2))
          if not d.get('passed',False):
              raise SystemExit('physical sine-ordered K-K-V triple FAILED')
          PY

name: two-node-sine-hda

on:
  push:
    paths:
      - 'PETER_WEYL_TWO_NODE_SINE_HDA_PREREGISTRATION.md'
      - 'scripts/peter_weyl_two_node_euclidean_sine_joint_gate.py'
      - 'scripts/peter_weyl_euclidean_sine_ordering_gate.py'
      - 'scripts/peter_weyl_route_dressed_local_gate.py'
  pull_request:
    paths:
      - 'PETER_WEYL_TWO_NODE_SINE_HDA_PREREGISTRATION.md'
      - 'scripts/peter_weyl_two_node_euclidean_sine_joint_gate.py'
      - 'THEORY_STATUS.md'
      - 'BCQG_CORE_CANDIDATE_V1.md'
      - 'theory_gates.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_two_node_euclidean_sine_joint_gate.py
      - name: Recheck sine Euclidean prerequisite
        run: |
          python scripts/peter_weyl_euclidean_sine_ordering_gate.py \
            --output verification_results/PETER_WEYL_EUCLIDEAN_SINE_ORDERING.json
      - name: Preregistered two-node sine HDA
        run: |
          python scripts/peter_weyl_two_node_euclidean_sine_joint_gate.py \
            --output verification_results/PETER_WEYL_TWO_NODE_SINE_HDA.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-node-sine-hda
          path: |
            verification_results/PETER_WEYL_EUCLIDEAN_SINE_ORDERING.json
            verification_results/PETER_WEYL_TWO_NODE_SINE_HDA.json
          if-no-files-found: warn

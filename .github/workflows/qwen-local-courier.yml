name: Qwen portable runtime courier
on:
  push:
    branches: [exp/qwen-local-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 5f436dddb440a288ee5611d7d1eca564a6aca9f4
          path: llama.cpp
          fetch-depth: 1
      - name: Patch and build portable CPU runtime
        run: |
          mkdir -p payload/bin
          python courier/llama_cpp_v3/apply_patch.py llama.cpp
          cmake -S llama.cpp -B llama.cpp/build             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DGGML_NATIVE=OFF             -DGGML_AVX=ON             -DGGML_AVX2=ON             -DGGML_FMA=ON             -DGGML_AVX512=OFF             -DGGML_AMX=OFF             -DLLAMA_CURL=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_EXAMPLES=ON             -DLLAMA_BUILD_SERVER=ON
          cmake --build llama.cpp/build --target llama-server llama-cli llama-bench llama-perplexity -j2
          cp llama.cpp/build/bin/llama-server payload/bin/
          cp llama.cpp/build/bin/llama-cli payload/bin/
          cp llama.cpp/build/bin/llama-bench payload/bin/
          cp llama.cpp/build/bin/llama-perplexity payload/bin/
          chmod +x payload/bin/*
          ./payload/bin/llama-cli --version
      - name: Upload portable runtime
        uses: actions/upload-artifact@v4
        with:
          name: qwen-runtime-portable
          path: payload/bin
          compression-level: 0
          retention-days: 3

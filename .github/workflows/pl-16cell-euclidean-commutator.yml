name: pl-16cell-euclidean-commutator

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - 'scripts/pl_16cell_euclidean_first_columns.py'
      - 'scripts/pl_16cell_euclidean_second_shard.py'
      - 'scripts/pl_16cell_euclidean_collect.py'
      - '.github/workflows/pl-16cell-euclidean-commutator.yml'
  workflow_dispatch:

jobs:
  first-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/pl_dual_complex.py
          python -m py_compile scripts/pl_peter_weyl_euclidean.py
          python -m py_compile scripts/pl_16cell_euclidean_first_columns.py
          python -m py_compile scripts/pl_16cell_euclidean_second_shard.py
          python -m py_compile scripts/pl_16cell_euclidean_collect.py
      - name: Compute H0 and H1 columns
        run: python scripts/pl_16cell_euclidean_first_columns.py --output first_columns.json
      - uses: actions/upload-artifact@v4
        with:
          name: pl16-first-columns
          path: first_columns.json
          if-no-files-found: error

  second-actions:
    needs: first-columns
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        direction: [h1h0, h0h1]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pl16-first-columns
          path: input
      - name: Compute exact second-action shard
        run: >-
          python scripts/pl_16cell_euclidean_second_shard.py
          --input input/first_columns.json
          --direction ${{ matrix.direction }}
          --shard ${{ matrix.shard }}
          --nshards 8
          --output partial_${{ matrix.direction }}_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: pl16-${{ matrix.direction }}-${{ matrix.shard }}
          path: partial_${{ matrix.direction }}_${{ matrix.shard }}.json
          if-no-files-found: error

  collect:
    needs: second-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: pl16-h*
          path: partials
          merge-multiple: true
      - name: Exact sparse reducer
        run: python scripts/pl_16cell_euclidean_collect.py --root partials --nshards 8 --output verification_results/PL_16CELL_EUCLIDEAN_COMMUTATOR.json
      - uses: actions/upload-artifact@v4
        with:
          name: pl16-euclidean-commutator
          path: verification_results/PL_16CELL_EUCLIDEAN_COMMUTATOR.json
          if-no-files-found: error

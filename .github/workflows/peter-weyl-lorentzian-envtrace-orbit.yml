name: peter-weyl-lorentzian-envtrace-orbit

on:
  push:
    branches:
      - research/pw-lorentzian-envtrace-orbit
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        spec: ['1 2 3 -1', '1 3 2 1']
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compute exact environment block
        shell: bash
        run: |
          read a b c s <<< '${{ matrix.spec }}'
          start=$(( ${{ matrix.batch }} * 4 ))
          stop=$(( start + 4 ))
          mkdir -p verification_results
          python scripts/peter_weyl_lorentzian_envtrace_block_gate.py \
            --a "$a" --b "$b" --c "$c" --coefficient "$s" \
            --env-start "$start" --env-stop "$stop" \
            --output "verification_results/block_${a}${b}${c}_${start}_${stop}.json"
      - name: Upload environment block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-envtrace-${{ strategy.job-index }}
          path: verification_results/block_*.json

  collect:
    needs: block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download eight exact blocks
        uses: actions/download-artifact@v4
        with:
          pattern: orbit-envtrace-*
          path: evidence
      - name: Build S4-orbit one-body coefficient
        run: |
          python scripts/peter_weyl_lorentzian_envtrace_orbit_collector.py \
            --root evidence \
            --output artifacts/peter_weyl_lorentzian_envtrace_orbit.json
      - name: Upload orbit evidence
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-envtrace-orbit-evidence
          path: artifacts/peter_weyl_lorentzian_envtrace_orbit.json

name: BQG multiplicity master RG shards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bqg-multiplicity-master-shards.yml'

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        s2: [4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute one RG scale
        run: |
          mkdir -p verification_results
          python scripts/bqg_serial_multiplicity_master_scan.py \
            --s2 ${{ matrix.s2 }} \
            --output verification_results/BQG_MULTIPLICITY_MASTER_S2_${{ matrix.s2 }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-multiplicity-master-s2-${{ matrix.s2 }}
          path: verification_results/BQG_MULTIPLICITY_MASTER_S2_${{ matrix.s2 }}.json
          retention-days: 30

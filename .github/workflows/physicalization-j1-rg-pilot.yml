name: physicalization-j1-rg-pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physicalization-j1-rg-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  columns:
    name: j1-column-${{ matrix.column }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 0 is a pure K=2^5 coarse state; 1 already contains the nontrivial
        # symmetry-fixed K=0/K=4 superposition on one logical node.
        column: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify canonical j=1 S4 blocking carrier
        run: |
          python scripts/peter_weyl_j1_s4_block_gate.py \
            --output verification_results/PETER_WEYL_J1_S4_BLOCK.json
      - name: Compute exact j=1 higher-shell pilot column
        run: |
          mkdir -p verification_results/j1_columns
          python scripts/peter_weyl_j1_higher_shell_lambda_gate.py \
            --column ${{ matrix.column }} \
            --output verification_results/j1_columns/column_${{ matrix.column }}.json
      - name: Upload pilot column
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j1-higher-shell-column-${{ matrix.column }}
          path: |
            verification_results/PETER_WEYL_J1_S4_BLOCK.json
            verification_results/j1_columns/column_${{ matrix.column }}.json
          if-no-files-found: warn
          compression-level: 6

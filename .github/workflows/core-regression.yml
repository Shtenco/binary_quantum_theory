name: core-regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Enforce GR-QM core scope
        run: python scripts/audit_core_scope.py

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Validate canonical proof ledger
        run: python scripts/verify_theory_gates.py

      - name: Validate public status surface
        run: python scripts/validate_github_latex.py README.md THEORY_STATUS.md OPEN_PROBLEMS.md BIT_TO_SPACETIME_CENTRAL_EQUATION.md

      - name: Frozen binary to smooth-spacetime gate
        run: python bcqg_observer_smoothing_unified.py --output verification_results/OBSERVER_SMOOTHING_RESULTS.json

      - name: Recursive q=2 PL manifold completion
        run: python bcqg_global_manifold_gate.py --output verification_results/GLOBAL_MANIFOLD_RESULTS.json

      - name: Frozen q=2 bits to geometry-qubit carrier
        run: python scripts/micro_walsh_qgeom_gate.py --output verification_results/MICRO_WALSH_QGEOM.json

      - name: Qubit to Einstein end-to-end control
        run: python scripts/qubit_to_einstein_end_to_end.py --output verification_results/QUBIT_TO_EINSTEIN.json

      - name: Regge to Einstein-Hilbert continuum bridge
        run: python scripts/regge_eh_cubic_bridge.py --output verification_results/REGGE_EH_CUBIC.json

      - name: Plebanski and Urbantke geometry reconstruction
        run: |
          python scripts/plebanski_urbantke_gate.py --output verification_results/PLEBANSKI_URBANTKE.json
          python scripts/plebanski_connection_einstein_gate.py --output verification_results/PLEBANSKI_EINSTEIN.json

      - name: Route-normal HDA
        run: python scripts/path_normal_hda_gate.py --output verification_results/PATH_NORMAL_HDA_RESULTS.json

      - name: Two-node Peter-Weyl by route Euclidean regression
        run: python scripts/peter_weyl_two_node_euclidean_joint_gate.py --output verification_results/PETER_WEYL_TWO_NODE_EUCLIDEAN.json

      - name: Three-node graph-changing Peter-Weyl by route HDA
        run: python scripts/peter_weyl_three_node_graph_hda_gate.py --output verification_results/PETER_WEYL_THREE_NODE_GRAPH_HDA.json

      - name: Joint epsilon and Peter-Weyl cutoff limit
        run: |
          python scripts/joint_regulator_limit_gate.py \
            --multi-node-json verification_results/PETER_WEYL_THREE_NODE_GRAPH_HDA.json \
            --output verification_results/JOINT_REGULATOR_LIMIT.json

      - name: HDA factorization no-go and route prerequisites
        run: python bcqg_quantum_hda_killer.py --output verification_results/QUANTUM_HDA_RESULTS.json

      - name: Lorentzian fixed coefficient and support bound
        run: |
          python scripts/lorentzian_hit_depth_bound.py
          python scripts/lorentzian_beta_cancellation_gate.py

      - name: Fixed-cutoff integration status
        run: python bcqg_bit_to_gravity_final.py --strict --output verification_results/FIXED_CUTOFF_BRIDGE.json

      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-geometry-gr-core
          path: verification_results/
          if-no-files-found: warn

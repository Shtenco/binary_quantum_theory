name: pr-frontier-smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-frontier-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile frontier sources
        run: |
          python -m py_compile scripts/micro_walsh_qgeom_gate.py
          python -m py_compile scripts/peter_weyl_three_node_graph_hda_gate.py
          python -m py_compile scripts/joint_regulator_limit_gate.py

      - name: Frozen q=2 bits to geometry-qubit carrier
        run: python scripts/micro_walsh_qgeom_gate.py --output verification_results/MICRO_WALSH_QGEOM.json

      - name: Three-node graph-changing Peter-Weyl by route HDA
        run: python scripts/peter_weyl_three_node_graph_hda_gate.py --output verification_results/PETER_WEYL_THREE_NODE_GRAPH_HDA.json

      - name: Joint epsilon and Peter-Weyl cutoff limit
        run: python scripts/joint_regulator_limit_gate.py --multi-node-json verification_results/PETER_WEYL_THREE_NODE_GRAPH_HDA.json --output verification_results/JOINT_REGULATOR_LIMIT.json

      - name: Upload frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-gates-macos
          path: verification_results/
          if-no-files-found: warn

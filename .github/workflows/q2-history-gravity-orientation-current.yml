name: q2-history-gravity-orientation-current

on:
  push:
    branches:
      - research/q2-history-gravity-orientation-current
    paths:
      - 'scripts/peter_weyl_history_orientation_current_gate.py'
      - '.github/workflows/q2-history-gravity-orientation-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-history-gravity-orientation-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microscopic-current:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Measure Peter-Weyl history orientation-current locking
        id: measurement
        shell: bash
        run: |
          mkdir -p verification_results
          set +e
          python scripts/peter_weyl_history_orientation_current_gate.py \
            --source-node 0 \
            --output verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.json
          code=$?
          echo "$code" > verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.exitcode
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload evidence before guard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-history-orientation-current
          path: verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.*
      - name: Enforce claim boundary
        run: |
          python - <<'PY'
          import json, pathlib
          path=pathlib.Path('verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.json')
          code=int(pathlib.Path('verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.exitcode').read_text().strip())
          assert path.exists(), 'measurement produced no JSON evidence'
          p=json.loads(path.read_text())
          print('measurement exit code =',code)
          print('checks =',json.dumps(p.get('checks',{}),indent=2,sort_keys=True))
          print('max spin =',p.get('max_spin_reached'))
          print('sine reconstruction error =',p.get('max_sine_history_reconstruction_relative_error'))
          intrinsic=p['intrinsic_environment_unbiased']
          env=p['fixed_K_environment_conditioned']
          complete=p['complete_source_Y_pauli_sector']
          allowed=(
            'INTRINSIC_NONZERO_FIRST_SHELL',
            'K_BASIS_ENVIRONMENT_CONDITIONED_FIRST_SHELL',
            'COHERENT_ENVIRONMENT_CONDITIONED_FIRST_SHELL',
            'ZERO_ALL_SOURCE_Y_PAULI_CHANNELS_FIRST_SHELL_WITHIN_TOL',
          )
          assert complete['rate_locking_status'] in allowed
          assert complete['phase_locking_status'] in allowed
          assert env['environment_count'] == 16
          assert complete['rate']['source_Y_string_count'] == 256
          assert complete['phase']['source_Y_string_count'] == 256
          assert p['checks']['complete_rate_source_Y_pauli_count_256'] is True
          assert p['checks']['complete_phase_source_Y_pauli_count_256'] is True
          assert 'not a physical-time Hamiltonian' in p['claim_boundary']
          print('g_YC_rate intrinsic =',intrinsic['g_YC_rate'])
          print('g_YC_phase intrinsic =',intrinsic['g_YC_phase'])
          print('max |g_YC_rate| fixed K env =',env['max_abs_rate_gY'])
          print('max |g_YC_phase| fixed K env =',env['max_abs_phase_gY'])
          print('max |rate source-Y Pauli| =',complete['rate']['max_abs_source_Y_coefficient'])
          print('max |phase source-Y Pauli| =',complete['phase']['max_abs_source_Y_coefficient'])
          print('rate status =',complete['rate_locking_status'])
          print('phase status =',complete['phase_locking_status'])
          assert code == 0, f'measurement script returned {code}'
          assert p['passed'] is True
          print('claim-boundary guards: PASS')
          PY

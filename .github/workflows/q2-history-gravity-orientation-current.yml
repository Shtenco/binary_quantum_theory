name: q2-history-gravity-orientation-current

on:
  push:
    branches:
      - research/q2-history-gravity-orientation-current
    paths:
      - 'scripts/peter_weyl_history_orientation_current_gate.py'
      - '.github/workflows/q2-history-gravity-orientation-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-history-gravity-orientation-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microscopic-current:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Measure Peter-Weyl history orientation-current locking
        run: |
          mkdir -p verification_results
          python scripts/peter_weyl_history_orientation_current_gate.py \
            --source-node 0 \
            --output verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.json
      - name: Enforce claim boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.json'))
          assert p['passed'] is True
          assert p['active_gauss_dimension'] == 32
          assert p['max_spin_reached'] <= 1.5 + 1e-12
          assert p['checks']['sine_history_reconstruction'] is True
          assert p['checks']['D_rate_hermitian'] is True
          assert p['checks']['D_phase_hermitian'] is True
          assert p['rate_locking_status'] in ('NONZERO_FIRST_SHELL','ZERO_FIRST_SHELL_WITHIN_TOL')
          assert p['phase_locking_status'] in ('NONZERO_FIRST_SHELL','ZERO_FIRST_SHELL_WITHIN_TOL')
          assert 'not a physical-time Hamiltonian' in p['claim_boundary']
          print('claim-boundary guards: PASS')
          print('g_YC_rate =',p['g_YC_rate'])
          print('g_YC_phase =',p['g_YC_phase'])
          print('rate status =',p['rate_locking_status'])
          print('phase status =',p['phase_locking_status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-history-orientation-current
          path: verification_results/PETER_WEYL_HISTORY_ORIENTATION_CURRENT.json

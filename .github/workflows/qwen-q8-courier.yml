        with:
          name: qwen-q8-chunk-07
          path: payload/chunks/qwen-q8.gguf.part.07
          compression-level: 0
          retention-days: 3

      - name: Upload Q8 chunk 08
        uses: actions/upload-artifact@v4
        with:
          name: qwen-q8-chunk-08
          path: payload/chunks/qwen-q8.gguf.part.08
          compression-level: 0
          retention-days: 3

      - name: Upload Q8 chunk 09
        uses: actions/upload-artifact@v4
        with:
          name: qwen-q8-chunk-09

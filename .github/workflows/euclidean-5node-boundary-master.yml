name: euclidean-5node-boundary-master

on:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - PETER_WEYL_EUCLIDEAN_5NODE_BOUNDARY_MASTER_PREREGISTRATION.md
      - scripts/peter_weyl_euclidean_5node_boundary_master_gate.py
      - .github/workflows/euclidean-5node-boundary-master.yml
  pull_request:
    paths:
      - PETER_WEYL_EUCLIDEAN_5NODE_BOUNDARY_MASTER_PREREGISTRATION.md
      - scripts/peter_weyl_euclidean_5node_boundary_master_gate.py
      - .github/workflows/euclidean-5node-boundary-master.yml

jobs:
  five-node-euclidean-boundary-master:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compute full five-node Euclidean boundary master
        run: |
          python scripts/peter_weyl_euclidean_5node_boundary_master_gate.py \
            --output verification_results/PETER_WEYL_EUCLIDEAN_5NODE_BOUNDARY_MASTER.json
      - name: Upload deterministic master evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euclidean-5node-boundary-master
          path: verification_results/PETER_WEYL_EUCLIDEAN_5NODE_BOUNDARY_MASTER.json
          if-no-files-found: warn

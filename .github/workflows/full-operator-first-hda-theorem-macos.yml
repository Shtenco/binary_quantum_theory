name: full-operator-first-hda-theorem-macos

on:
  push:
    paths:
      - '.github/workflows/full-operator-first-hda-theorem-macos.yml'

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sympy
        run: python -m pip install sympy
      - name: Verify theorem gate
        run: |
          python scripts/full_operator_first_hda_theorem_gate.py \
            --route-evidence verification_results/PETER_WEYL_OPERATOR_ROUTE_SPINCHANGED_BLOCKS.json \
            --output verification_results/FULL_OPERATOR_FIRST_HDA_THEOREM.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-operator-first-hda-theorem-macos
          path: verification_results/FULL_OPERATOR_FIRST_HDA_THEOREM.json
          if-no-files-found: warn

name: Qwen GGUF chunk courier
on:
  push:
    branches: [exp/qwen-chunks]
  workflow_dispatch:
jobs:
  chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Qwen GGUF
        run: |
          mkdir -p payload/chunks
          curl -L --fail --retry 8 --retry-delay 3             "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true"             -o payload/qwen.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  payload/qwen.gguf" | sha256sum -c -
          split -b 75M -d -a 2 payload/qwen.gguf payload/chunks/qwen.part.
          sha256sum payload/chunks/qwen.part.* | tee payload/chunks/SHA256SUMS.txt
          ls -lh payload/chunks
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-00
          path: payload/chunks/qwen.part.00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-01
          path: payload/chunks/qwen.part.01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-02
          path: payload/chunks/qwen.part.02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-03
          path: payload/chunks/qwen.part.03
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-04
          path: payload/chunks/qwen.part.04
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-05
          path: payload/chunks/qwen.part.05
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-part-06
          path: payload/chunks/qwen.part.06
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-chunk-checksums
          path: payload/chunks/SHA256SUMS.txt
          compression-level: 6
          retention-days: 3

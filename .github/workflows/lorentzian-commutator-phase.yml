name: lorentzian-commutator-phase

on:
  push:
    paths:
      - 'verification_results/PETER_WEYL_LORENTZIAN_ENVTRACE_ORBIT.json'
      - 'scripts/lorentzian_commutator_phase_gate.py'
      - 'LORENTZIAN_COMMUTATOR_PHASE_CERTIFICATE.md'
  pull_request:
    paths:
      - 'verification_results/PETER_WEYL_LORENTZIAN_ENVTRACE_ORBIT.json'
      - 'scripts/lorentzian_commutator_phase_gate.py'
      - 'LORENTZIAN_COMMUTATOR_PHASE_CERTIFICATE.md'
      - 'THEORY_STATUS.md'
      - 'BCQG_CORE_CANDIDATE_V1.md'
      - 'theory_gates.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile scripts/lorentzian_commutator_phase_gate.py
      - name: Derive and verify canonical bracket phase
        run: |
          python scripts/lorentzian_commutator_phase_gate.py \
            --output verification_results/LORENTZIAN_COMMUTATOR_PHASE.json
      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-commutator-phase
          path: verification_results/LORENTZIAN_COMMUTATOR_PHASE.json
          if-no-files-found: warn

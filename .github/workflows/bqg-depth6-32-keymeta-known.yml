name: BQG depth6 [3,2] extract key metadata from known shards
on:
  push:
    branches: [research/depth6-s4sign-proof]
    paths:
      - '.github/workflows/bqg-depth6-32-keymeta-known.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  keymeta:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 0
            artifact_id: '11189001648'
            artifact_digest: 'sha256:5b908e4b93c675e7bfdaf5ad228e3526208adec8140e5e9d6f88ccb61c99db48'
          - shard: 6
            artifact_id: '11187133632'
            artifact_digest: 'sha256:b7605047e45b4855e1663e2f22a13a66e7e32c683e81e8f58fba0f5bf0aee3bb'
          - shard: 8
            artifact_id: '11187460302'
            artifact_digest: 'sha256:9902453cc2ed6dc2eedc3585fb2ae6b1a99bf74aa0be8402585fa22549eebee5'
          - shard: 11
            artifact_id: '11189890501'
            artifact_digest: 'sha256:e795e270beebe4bc2b31a2241b6900b4a95060588608d080adfc57f386967307'
          - shard: 12
            artifact_id: '11185097491'
            artifact_digest: 'sha256:e102517cb41a1639a098ec3f6ec9780ef135e584f44cba90d10f5a7819e2f566'
          - shard: 13
            artifact_id: '11186940750'
            artifact_digest: 'sha256:0de0c7ae9a8199e1330b5255065333b00420f8cc639196fced2219d996291148'
          - shard: 14
            artifact_id: '11185982461'
            artifact_digest: 'sha256:a67020b65b4f49eb6808d8dc926f76d2c888f6c24d568b30e854ec1570e7cae4'
          - shard: 17
            artifact_id: '11185818245'
            artifact_digest: 'sha256:8a81bcd292e24460098b8d0c65111cd047f5da25ef159b40112db52496c71516'
          - shard: 18
            artifact_id: '11184840100'
            artifact_digest: 'sha256:30c44ee2008b50b06176a97ef4001412603b7cefaa0614cc7ac68b412056b4dc'
          - shard: 19
            artifact_id: '11186468774'
            artifact_digest: 'sha256:69b83e982a35bf10fbc7585f2acf7dd2708288ab4830025e4f8f5dae99177b22'
          - shard: 20
            artifact_id: '11188262755'
            artifact_digest: 'sha256:c94b8145db33017407a67de19b78d6607a4c3fe365608d2bf7863e7d3e399c19'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Download already-computed raw artifact only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p input_zip input
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "input_zip/shard-${SHARD}.zip"
          unzip -q "input_zip/shard-${SHARD}.zip" -d input
          test -f "input/bqg-mixed-32-shard-${SHARD}.tar.gz"
      - name: Extract persisted numerical map key metadata
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          SHARD: ${{ matrix.shard }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          ARTIFACT_DIGEST: ${{ matrix.artifact_digest }}
        run: |
          python -u mixed_parallel/extract_master_key_metadata.py \
            --src "input/bqg-mixed-32-shard-${SHARD}.tar.gz" \
            --work "keymeta_work_${SHARD}" \
            --out "bqg-mixed-32-shard-${SHARD}-keymeta.pkl.gz" \
            --json "bqg-mixed-32-shard-${SHARD}-keymeta-stats.json" \
            --source-run-id 36899125190 \
            --source-artifact-id "${ARTIFACT_ID}" \
            --source-artifact-digest "${ARTIFACT_DIGEST}" \
            --engine-git-blob-sha cbbaa80f6b6b61d353458db1fa1f03f824730532
          python - "bqg-mixed-32-shard-${SHARD}-keymeta-stats.json" "${SHARD}" <<'PY'
          import json,sys
          p, expected = sys.argv[1], int(sys.argv[2])
          x=json.load(open(p))
          assert x['kind']=='BQG_MIXED_MASTER_KEY_METADATA' and x['schema_version']==1,x
          assert x['irrep']=='32' and int(x['shard'])==expected and int(x['shards'])==112,x
          assert int(x['assigned_blocks'])==int(x['stats']['blocks']),x
          assert int(x['assigned_columns'])==int(x['stats']['columns']),x
          print('KEYMETA_PASS', expected, x['stats'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-mixed-32-shard-${{ matrix.shard }}-keymeta
          path: |
            bqg-mixed-32-shard-${{ matrix.shard }}-keymeta.pkl.gz
            bqg-mixed-32-shard-${{ matrix.shard }}-keymeta-stats.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

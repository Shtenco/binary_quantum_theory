name: lorentzian-middle-prefix

on:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - 'scripts/peter_weyl_lorentzian_middle_prefix_gate.py'
      - '.github/workflows/lorentzian-middle-prefix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remaining-prefixes:
    strategy:
      fail-fast: false
      matrix:
        pair_index: [0, 1, 3, 4, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Compute exact middle prefix
        run: |
          mkdir -p prefix_results
          python scripts/peter_weyl_lorentzian_middle_prefix_gate.py \
            --source-node 0 --input-index 0 \
            --pair-index ${{ matrix.pair_index }} \
            --output prefix_results/prefix_${{ matrix.pair_index }}.json
      - name: Upload reusable middle state
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-middle-prefix-${{ matrix.pair_index }}
          path: prefix_results/prefix_${{ matrix.pair_index }}.json
          if-no-files-found: error

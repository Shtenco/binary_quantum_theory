name: peter-weyl-lorentzian-parity

on:
  push:
    branches:
      - research/pw-lorentzian-parity
  pull_request:
    paths:
      - 'scripts/peter_weyl_lorentzian_parity_gate.py'
      - 'PETER_WEYL_LORENTZIAN_PARITY_FRONTIER.md'
      - '.github/workflows/peter-weyl-lorentzian-parity.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_parity_gate.py
      - name: Lorentzian spin-parity selection theorem
        run: python scripts/peter_weyl_lorentzian_parity_gate.py

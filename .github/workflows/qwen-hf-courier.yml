name: Qwen HF local courier
on:
  push:
    branches: [exp/qwen-f16-courier]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download HF source and wheels
        run: |
          mkdir -p payload/hf payload/chunks payload/wheelhouse
          python -m pip install -U pip
          python -m pip install "huggingface_hub>=0.35" --no-cache-dir
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "Qwen/Qwen2.5-0.5B-Instruct",
              local_dir="payload/hf",
              allow_patterns=[
                  "*.json","*.safetensors","tokenizer*","merges.txt","vocab.json",
                  "*.model","*.txt"
              ],
          )
          PY
          find payload/hf -maxdepth 2 -type f -printf '%s %p\n' | sort -nr
          python -m pip download --dest payload/wheelhouse --only-binary=:all: \
            "transformers==4.57.1" "tokenizers>=0.22,<0.23" "huggingface_hub>=0.35" \
            "regex" "requests" "packaging" "pyyaml" "filelock" "fsspec" "tqdm" "safetensors>=0.4"
      - name: Normalize weights and split
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("payload/hf")
          files=sorted(root.glob("*.safetensors"))
          print("SAFETENSORS",[(p.name,p.stat().st_size) for p in files])
          if len(files)==1:
              src=files[0]
              if src.name!="model.safetensors":
                  src.rename(root/"model.safetensors")
          elif len(files)>1:
              raise SystemExit("multiple safetensors shards; workflow expects one for 0.5B")
          else:
              raise SystemExit("no safetensors")
          PY
          sha256sum payload/hf/model.safetensors | tee payload/hf/model.sha256
          split -b 50M -d -a 2 payload/hf/model.safetensors payload/chunks/model.safetensors.part.
          rm payload/hf/model.safetensors
          ls -lh payload/chunks
      - name: Upload HF metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwen-hf-metadata
          path: |
            payload/hf
            payload/wheelhouse
          retention-days: 3

      - name: Upload weights chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: qwen-hf-weights-00
          path: payload/chunks/model.safetensors.part.00
          compression-level: 0
          retention-days: 3

      - name: Upload weights chunk 01

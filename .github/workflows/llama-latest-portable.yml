name: Latest llama portable runtime
on:
  push:
    branches: [exp/qwen-f16-courier]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 542e9202d7d14863562e1e908be0bf32aeec2c2a
          path: llama.cpp
          fetch-depth: 1
      - name: Build portable current llama.cpp
        run: |
          mkdir -p payload/bin
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_AVX512=OFF \
            -DGGML_AMX=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build llama.cpp/build --target llama-server llama-cli -j2
          cp llama.cpp/build/bin/llama-server payload/bin/
          cp llama.cpp/build/bin/llama-cli payload/bin/
          chmod +x payload/bin/*
          ./payload/bin/llama-cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: llama-latest-portable
          path: payload/bin
          compression-level: 0
          retention-days: 3

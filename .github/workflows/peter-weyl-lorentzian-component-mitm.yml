name: peter-weyl-lorentzian-component-mitm
on:
  push:
    branches: [research/pw-lorentzian-component-mitm]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Safe one-path logical return
        run: python scripts/peter_weyl_lorentzian_component_mitm_gate.py --output verification_results/PETER_WEYL_LORENTZIAN_COMPONENT_MITM.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-component-mitm-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_COMPONENT_MITM.json

name: mirror-regression

on:
  push:
    branches: [main]
    paths:
      - 'MIRROR_CHIRALITY_GRAVITY.md'
      - 'MICROSCOPIC_MIRROR_ORDER.md'
      - 'MIRROR_HEISENBERG_PARENT.md'
      - 'MIRROR_GOLDSTONE_SOURCE.md'
      - 'ORIENTATION_ODD_HDA_CONSTRUCTION.md'
      - 'MIRROR_FORCE_NORMALIZATION.md'
      - 'MIRROR_MATTER_MATRIX_ELEMENT.md'
      - 'MIRROR_WILSON_MATTER.md'
      - 'MIRROR_SIGMA_RANGE.md'
      - 'MIRROR_MASTER_CRITERION.md'
      - 'scripts/mirror_*.py'
      - 'theory_gates.json'
      - '.github/workflows/mirror-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MIRROR_CHIRALITY_GRAVITY.md'
      - 'MICROSCOPIC_MIRROR_ORDER.md'
      - 'MIRROR_HEISENBERG_PARENT.md'
      - 'MIRROR_GOLDSTONE_SOURCE.md'
      - 'ORIENTATION_ODD_HDA_CONSTRUCTION.md'
      - 'MIRROR_FORCE_NORMALIZATION.md'
      - 'MIRROR_MATTER_MATRIX_ELEMENT.md'
      - 'MIRROR_WILSON_MATTER.md'
      - 'MIRROR_SIGMA_RANGE.md'
      - 'MIRROR_MASTER_CRITERION.md'
      - 'scripts/mirror_*.py'
      - 'theory_gates.json'
      - '.github/workflows/mirror-regression.yml'

permissions:
  contents: read

concurrency:
  group: mirror-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax and proof ledger
        run: |
          python -m py_compile \
            scripts/mirror_chirality_gravity_gate.py \
            scripts/mirror_order_16cell_gate.py \
            scripts/mirror_order_recursive_pl_gate.py \
            scripts/mirror_heisenberg_parent_gate.py \
            scripts/mirror_goldstone_source_gate.py \
            scripts/orientation_odd_hda_gate.py \
            scripts/mirror_force_normalization_gate.py \
            scripts/mirror_hodge_stiffness_gate.py \
            scripts/mirror_matter_matrix_element_gate.py \
            scripts/mirror_wilson_matter_gate.py \
            scripts/mirror_sigma_range_gate.py \
            scripts/mirror_master_criterion_gate.py
          python scripts/verify_theory_gates.py
      - name: Mirror chirality and metric falsifier
        run: python scripts/mirror_chirality_gravity_gate.py --output verification_results/MIRROR_CHIRALITY_GRAVITY.json
      - name: Microscopic 16-cell mirror order
        run: python scripts/mirror_order_16cell_gate.py --output verification_results/MIRROR_ORDER_16CELL.json
      - name: Recursive PL mirror-order persistence
        run: python scripts/mirror_order_recursive_pl_gate.py --refinements 2 --output verification_results/MIRROR_ORDER_RECURSIVE_PL.json
      - name: Exact Bell-gluing Heisenberg parent
        run: python scripts/mirror_heisenberg_parent_gate.py --output verification_results/MIRROR_HEISENBERG_PARENT.json
      - name: Longitudinal mirror Goldstone-source control
        run: python scripts/mirror_goldstone_source_gate.py --output verification_results/MIRROR_GOLDSTONE_SOURCE.json
      - name: Orientation-odd HDA and healthy force
        run: python scripts/orientation_odd_hda_gate.py --output verification_results/ORIENTATION_ODD_HDA.json
      - name: Force normalization and source selection
        run: python scripts/mirror_force_normalization_gate.py --output verification_results/MIRROR_FORCE_NORMALIZATION.json
      - name: Hodge-weighted stiffness
        run: python scripts/mirror_hodge_stiffness_gate.py --output verification_results/MIRROR_HODGE_STIFFNESS.json
      - name: Matter matrix element and axial static-source falsifier
        run: python scripts/mirror_matter_matrix_element_gate.py --output verification_results/MIRROR_MATTER_MATRIX_ELEMENT.json
      - name: Mirror-covariant Wilson-Dirac matter carrier
        run: python scripts/mirror_wilson_matter_gate.py --output verification_results/MIRROR_WILSON_MATTER.json
      - name: Symmetry-resolved Ising sigma gap and temporal response
        run: python scripts/mirror_sigma_range_gate.py --output verification_results/MIRROR_SIGMA_RANGE.json
      - name: Dimensionless mirror-force master criterion
        run: python scripts/mirror_master_criterion_gate.py --output verification_results/MIRROR_MASTER_CRITERION.json
      - name: Upload mirror evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-sector-evidence
          path: verification_results/
          if-no-files-found: warn

name: lorentzian-outer-continuation
# Canonical reusable middle-prefix evidence: run 33964666509, head e832adbf339632c8a80e426f28adf5bb4e463316.

on:
  workflow_dispatch:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - 'scripts/peter_weyl_lorentzian_outer_continuation_gate.py'
      - 'scripts/peter_weyl_lorentzian_first_column_aggregate.py'
      - '.github/workflows/lorentzian-outer-continuation.yml'

permissions:
  contents: read
  actions: read

env:
  PREFIX_RUN_ID: '33964666509'
  PREFIX_HEAD_SHA: 'e832adbf339632c8a80e426f28adf5bb4e463316'

jobs:
  continuation:
    strategy:
      fail-fast: false
      matrix:
        pair_index: [0, 1, 3, 4, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Download certified reusable middle prefix
        uses: actions/download-artifact@v4
        with:
          name: lorentzian-middle-prefix-${{ matrix.pair_index }}
          path: prefix_input
          github-token: ${{ github.token }}
          run-id: ${{ env.PREFIX_RUN_ID }}
      - name: Continue only the two surviving outer C(K) terms
        run: |
          mkdir -p continuation_results
          python scripts/peter_weyl_lorentzian_outer_continuation_gate.py \
            --prefix-packet prefix_input/prefix_${{ matrix.pair_index }}.json \
            --prefix-run-id $PREFIX_RUN_ID \
            --prefix-head-sha $PREFIX_HEAD_SHA \
            --output continuation_results/continuation_${{ matrix.pair_index }}.json
      - name: Upload pair continuation
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-outer-continuation-${{ matrix.pair_index }}
          path: continuation_results/continuation_${{ matrix.pair_index }}.json
          if-no-files-found: error

  aggregate-first-column:
    needs: continuation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Download six continuation packets
        uses: actions/download-artifact@v4
        with:
          pattern: lorentzian-outer-continuation-*
          path: continuation_results
          merge-multiple: true
      - name: Reconstruct full signed first Lorentzian column
        run: |
          mkdir -p aggregate_results
          python scripts/peter_weyl_lorentzian_first_column_aggregate.py \
            --directory continuation_results \
            --output aggregate_results/LORENTZIAN_FIRST_LOGICAL_COLUMN.json
      - name: Upload reconstructed first-column microscopic packet
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-first-logical-column
          path: aggregate_results/LORENTZIAN_FIRST_LOGICAL_COLUMN.json
          if-no-files-found: error

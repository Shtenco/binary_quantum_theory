name: lorentzian-route-logical-cross

on:
  push:
    paths:
      - 'scripts/lorentzian_route_logical_cross_gate.py'
      - 'LORENTZIAN_ROUTE_LOGICAL_CROSS.md'
      - 'LOGICAL_ROUTE_METRIC_ORDERING.md'
      - '.github/workflows/lorentzian-route-logical-cross.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile scripts/lorentzian_route_logical_cross_gate.py
      - name: Logical Lorentzian-route ordering discriminator
        run: |
          python scripts/lorentzian_route_logical_cross_gate.py \
            --output verification_results/LORENTZIAN_ROUTE_LOGICAL_CROSS.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-route-logical-cross
          path: verification_results/LORENTZIAN_ROUTE_LOGICAL_CROSS.json
          if-no-files-found: warn

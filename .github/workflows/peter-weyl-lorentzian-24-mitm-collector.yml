name: peter-weyl-lorentzian-24-mitm-collector

on:
  push:
    branches:
      - research/pw-lorentzian-24-collector
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Download the 24 independent triple artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31832450485
          pattern: lorentzian-triple-*
          path: evidence
      - name: Collect complete epsilon sum
        run: |
          python scripts/peter_weyl_lorentzian_24_mitm_collector.py \
            --root evidence \
            --output artifacts/peter_weyl_lorentzian_24_mitm_collected.json
      - name: Upload collected evidence
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-24-mitm-collected-evidence
          path: artifacts/peter_weyl_lorentzian_24_mitm_collected.json

name: v13-operator-correction-consistency

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'START_HERE.md'
      - 'THEORY_STATUS.md'
      - 'BCQG_CANDIDATE_THEORY_V1_3_DRAFT.md'
      - 'theory_gates_v13.json'
      - 'PL_16CELL_HERMITIAN_LORENTZIAN_PREREGISTRATION_V2.md'
      - 'scripts/v13_operator_correction_consistency_gate.py'
      - 'scripts/tetrahedral_charged_volume_audit_gate.py'
      - 'verification_results/TETRAHEDRAL_CHARGED_VOLUME_AUDIT_LOCAL.json'
      - '.github/workflows/v13-operator-correction-consistency.yml'
  workflow_dispatch:

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile scripts/v13_operator_correction_consistency_gate.py
      - name: v1.3 canonical addendum consistency
        run: python scripts/v13_operator_correction_consistency_gate.py > verification_results/V13_OPERATOR_CORRECTION_CONSISTENCY.json
      - name: Echo result
        if: always()
        run: cat verification_results/V13_OPERATOR_CORRECTION_CONSISTENCY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-operator-correction-consistency
          path: verification_results/V13_OPERATOR_CORRECTION_CONSISTENCY.json
          if-no-files-found: error

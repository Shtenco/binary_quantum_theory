name: peter-weyl-lorentzian-lowcut-scout

on:
  push:
    branches:
      - research/pw-lorentzian-lowcut-scout

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_lorentzian_lowcut_scout.py
      - name: Low-cutoff logical-return scout
        run: |
          python scripts/peter_weyl_lorentzian_lowcut_scout.py \
            --output verification_results/PETER_WEYL_LORENTZIAN_LOWCUT_SCOUT.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-lowcut-scout-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_LOWCUT_SCOUT.json

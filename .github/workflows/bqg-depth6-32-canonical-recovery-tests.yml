name: BQG depth6 32 canonical recovery tests

on:
  push:
    branches:
      - bqg/depth6-32-canonical-recovery
  pull_request:
    paths:
      - 'scripts/depth6_keymeta_coverage.py'
      - 'scripts/inventory_depth6_32_keymeta.py'
      - 'scripts/verify_depth6_32_recovery_frontier.py'
      - 'scripts/depth6_assignment_ledger.py'
      - 'scripts/plan_depth6_32_batches.py'
      - 'BQG_DEPTH6_32_ASSIGNMENT_LEDGER_2026-10-02.json'
      - 'scripts/test_depth6_keymeta_coverage.py'
      - 'scripts/test_inventory_depth6_32_keymeta.py'
      - 'scripts/test_verify_depth6_32_recovery_frontier.py'
      - 'scripts/test_depth6_assignment_ledger.py'
      - 'scripts/test_plan_depth6_32_batches.py'
      - '.github/workflows/bqg-depth6-32-canonical-recovery-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run canonical recovery unit tests
        working-directory: scripts
        run: |
          python -m unittest -v \
            test_depth6_keymeta_coverage.py \
            test_inventory_depth6_32_keymeta.py \
            test_verify_depth6_32_recovery_frontier.py \
            test_depth6_assignment_ledger.py \
            test_plan_depth6_32_batches.py

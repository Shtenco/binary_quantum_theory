name: q4-local-s4-obstruction-research

on:
  push:
    branches:
      - 'audit/q4-s4-background-obstruction'
    paths:
      - 'Q4_LOCAL_S4_BACKGROUND_OBSTRUCTION.md'
      - 'scripts/q4_local_s4_singlet_obstruction_gate.py'
      - '.github/workflows/q4-local-s4-obstruction-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q4-local-s4-obstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-s4-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile gate
        run: python -m py_compile scripts/q4_local_s4_singlet_obstruction_gate.py
      - name: Run exact local S4 obstruction gate
        run: |
          python scripts/q4_local_s4_singlet_obstruction_gate.py \
            --output verification_results/Q4_LOCAL_S4_SINGLET_OBSTRUCTION.json
      - name: Guard interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('verification_results/Q4_LOCAL_S4_SINGLET_OBSTRUCTION.json').read_text())
          assert x['passed'] is True
          assert x['representation_irrep'] == 'S4 [2,2]'
          assert x['invariant_subspace_dimension'] == 0
          assert x['checks']['full_S4_trivial_projector_vanishes'] is True
          assert x['checks']['generic_pure_density_twirl_is_I_over_2'] is True
          assert 'does not prove physical anisotropy' in x['claim_boundary']
          print('local S4 obstruction interpretation guard: PASS')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q4-local-s4-obstruction-evidence
          path: verification_results/Q4_LOCAL_S4_SINGLET_OBSTRUCTION.json
          if-no-files-found: error

name: lorentzian-full-column-dag

on:
  workflow_dispatch:
  push:
    branches:
      - research/physical-scalar-kernel-dynamics
    paths:
      - 'scripts/peter_weyl_lorentzian_full_column_dag_gate.py'
      - '.github/workflows/lorentzian-full-column-dag.yml'

permissions:
  contents: read

jobs:
  input0-source0:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute complete raw H_L column in one cache-preserving DAG
        run: |
          python scripts/peter_weyl_lorentzian_full_column_dag_gate.py \
            --source-node 0 \
            --input-index 0 \
            --output results/lorentzian_full_column_dag_source0_input0.json
      - name: Verify first-column structural contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('results/lorentzian_full_column_dag_source0_input0.json'))
          assert p['passed'] is True
          assert p['unique_CV_state_count']==16
          assert p['nonzero_prefix_indices']==[0,1,3,4,6,7],p['nonzero_prefix_indices']
          assert p['zero_prefix_indices']==[2,5,8,9,10,11],p['zero_prefix_indices']
          assert p['outer_CK_call_count']==48
          assert p['hard_integrity_checks']['all_24_ordered_triples_unique'] is True
          print('PASS full-column DAG',p['science_status'],p['full_outgoing_support'],p['full_outgoing_norm'])
          PY
      - name: Upload full raw Lorentzian column
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-full-column-dag-source0-input0
          path: results/lorentzian_full_column_dag_source0_input0.json
          if-no-files-found: warn

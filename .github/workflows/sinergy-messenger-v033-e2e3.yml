name: SINERGY Messenger v0.3.3 STABLE Full Android E2E
on:
  push:
    branches: [ci-sinergy-messenger-v030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v0.3.3 and set stable package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/sinergy-messenger-v030.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(y) if '- name: Restore v0.3.2 and apply full CSP-safe UI fix' in l)
          run=next(i+1 for i in range(start+1,len(y)) if y[i].strip()=='run: |')
          body=[]
          for line in y[run:]:
              if line.startswith('      - '): break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reconstruct.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/reconstruct.sh
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' ci/sinergy-messenger-v033/gradle.properties
          sed -i 's/applicationId = "ai.sinergy.messenger.quantum"/applicationId = "ai.sinergy.messenger.stable"/' ci/sinergy-messenger-v033/app/build.gradle.kts
          sed -i 's/versionCode = 304/versionCode = 305/' ci/sinergy-messenger-v033/app/build.gradle.kts
          sed -i 's/versionName = "0.3.3"/versionName = "0.3.3-stable"/' ci/sinergy-messenger-v033/app/build.gradle.kts
          sed -i 's/waitJs("peer&&peer.fingerprint",30)/waitJs("!!(peer\&\&peer.fingerprint)",30)/' ci/sinergy-messenger-v033/app/src/androidTest/java/ai/sinergy/messenger/secure/FullUiE2ETest.java
          grep -F 'applicationId = "ai.sinergy.messenger.stable"' ci/sinergy-messenger-v033/app/build.gradle.kts
          grep -F 'versionCode = 305' ci/sinergy-messenger-v033/app/build.gradle.kts
          grep -F 'waitJs("!!(peer&&peer.fingerprint)",30)' ci/sinergy-messenger-v033/app/src/androidTest/java/ai/sinergy/messenger/secure/FullUiE2ETest.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android SDK
        working-directory: ci/sinergy-messenger-v033
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: PQ tests and release build
        working-directory: ci/sinergy-messenger-v033
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full Android WebView E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd ci/sinergy-messenger-v033 && gradle :app:connectedDebugAndroidTest --stacktrace --info
      - name: Verify release payload
        working-directory: ci/sinergy-messenger-v033
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/www/app.js | grep -F 'installUiEvents()'
          ! unzip -p "$APK" assets/www/app.js | grep -Eq 'onclick="|onkeydown="'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -F "package: name='ai.sinergy.messenger.stable' versionCode='305' versionName='0.3.3-stable'"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS-v033-stable.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sinergy-messenger-v0.3.3-stable-e2e-green-unsigned
          path: |
            ci/sinergy-messenger-v033/app/build/outputs/apk/release/app-release-unsigned.apk
            ci/sinergy-messenger-v033/app/build/outputs/apk/release/SHA256SUMS-v033-stable.txt
            ci/sinergy-messenger-v033/app/build/outputs/androidTest-results/
            ci/sinergy-messenger-v033/app/build/reports/androidTests/connected/
          if-no-files-found: error
          retention-days: 7

name: modular-complex-arithmetic

on:
  push:
    branches:
      - research/modular-complex-arithmetic-bridge
    paths:
      - 'MODULAR_COMPLEX_TO_ORDINARY_ARITHMETIC.md'
      - 'scripts/modular_complex_arithmetic_bridge_gate.py'
      - '.github/workflows/modular-complex-arithmetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact modular-complex arithmetic bridge gate
        run: |
          mkdir -p verification_results
          python scripts/modular_complex_arithmetic_bridge_gate.py \
            --json verification_results/modular_complex_arithmetic_bridge_gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: modular-complex-arithmetic-gate
          path: verification_results/modular_complex_arithmetic_bridge_gate.json

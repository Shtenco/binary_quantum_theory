name: Qwen activation calibration
on:
  push:
    branches: [exp/qwen-activation-calibration]
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install calibration stack
        run: |
          python -m pip install -U pip
          python -m pip install "torch>=2.6" "transformers>=4.48,<5" "safetensors>=0.4" "numpy>=2,<3"
      - name: Capture activation second moments
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python calibration_capture.py
      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: qwen-activation-calibration
          path: |
            activation.npz
            activation.npz.json
          compression-level: 6
          retention-days: 3

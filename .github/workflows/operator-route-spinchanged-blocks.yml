name: operator-route-spinchanged-blocks

# Run only when the route-block implementation changes on the research branch.
# PR path filters retriggered this gate on every later synchronize commit.
on:
  push:
    paths:
      - 'scripts/peter_weyl_operator_route_block_engine.py'
      - 'scripts/peter_weyl_operator_route_block_gate.py'
      - 'scripts/operator_route_sparse_fourier.py'
      - '.github/workflows/operator-route-spinchanged-blocks.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scripts/peter_weyl_operator_route_block_engine.py
          python -m py_compile scripts/peter_weyl_operator_route_block_gate.py
      - name: Test genuine spin-changed route blocks
        run: |
          python scripts/peter_weyl_operator_route_block_gate.py \
            --n-sectors 5 \
            --output verification_results/PETER_WEYL_OPERATOR_ROUTE_SPINCHANGED_BLOCKS.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-route-spinchanged-blocks
          path: verification_results/PETER_WEYL_OPERATOR_ROUTE_SPINCHANGED_BLOCKS.json
          if-no-files-found: warn

name: Omega V6 CI relay
on:
  push:
    branches: [exp/qwen-local-courier]
  workflow_dispatch:
jobs:
  test-omega-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Shtenco/synergy_gguf_compress
          ref: feat/omega-mix-infinity-v6
          path: omega
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test exact Omega V6 branch
        run: |
          cd omega
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          pytest -q

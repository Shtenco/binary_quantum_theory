name: Omega V6 CI relay
on:
  push:
    branches: [exp/qwen-local-courier]
  workflow_dispatch:
jobs:
  test-omega-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone exact Omega V6 branch
        run: |
          git clone --depth 1 --branch feat/omega-mix-infinity-v6             https://github.com/Shtenco/synergy_gguf_compress.git omega
          git -C omega rev-parse HEAD
      - name: Install and test exact Omega V6 branch
        run: |
          cd omega
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
          pytest -q

name: peter-weyl-lorentzian-envtrace

on:
  push:
    branches:
      - research/pw-lorentzian-envtrace
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  envblock:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 48
      matrix:
        spec:
          - '2 3 4 1'
          - '2 4 3 -1'
          - '3 2 4 -1'
          - '3 4 2 1'
          - '4 2 3 1'
          - '4 3 2 -1'
          - '1 3 4 -1'
          - '1 4 3 1'
          - '3 1 4 1'
          - '3 4 1 -1'
          - '4 1 3 -1'
          - '4 3 1 1'
          - '1 2 4 1'
          - '1 4 2 -1'
          - '2 1 4 -1'
          - '2 4 1 1'
          - '4 1 2 1'
          - '4 2 1 -1'
          - '1 2 3 -1'
          - '1 3 2 1'
          - '2 1 3 1'
          - '2 3 1 -1'
          - '3 1 2 -1'
          - '3 2 1 1'
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compute diagonal environment block
        shell: bash
        run: |
          read a b c s <<< '${{ matrix.spec }}'
          start=$(( ${{ matrix.batch }} * 4 ))
          stop=$(( start + 4 ))
          mkdir -p verification_results
          python scripts/peter_weyl_lorentzian_envtrace_block_gate.py \
            --a "$a" --b "$b" --c "$c" --coefficient "$s" \
            --env-start "$start" --env-stop "$stop" \
            --output "verification_results/block_${a}${b}${c}_${start}_${stop}.json"
      - name: Upload block evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lorentzian-envtrace-${{ strategy.job-index }}
          path: verification_results/block_*.json

  collect:
    needs: envblock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependency
        run: python -m pip install numpy
      - name: Download all 96 environment blocks
        uses: actions/download-artifact@v4
        with:
          pattern: lorentzian-envtrace-*
          path: evidence
      - name: Build exact one-body partial trace
        run: |
          python scripts/peter_weyl_lorentzian_envtrace_collector.py \
            --root evidence \
            --output artifacts/peter_weyl_lorentzian_envtrace.json
      - name: Upload one-body trace evidence
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-envtrace-evidence
          path: artifacts/peter_weyl_lorentzian_envtrace.json

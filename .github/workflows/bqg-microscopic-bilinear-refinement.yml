name: BQG microscopic bilinear refinement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_microscopic_bilinear_refinement_gate.py'
      - '.github/workflows/bqg-microscopic-bilinear-refinement.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Check microscopic bilinear refinement tensor
        run: python scripts/bqg_microscopic_bilinear_refinement_gate.py

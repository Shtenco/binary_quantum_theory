name: operator-first-route-hda

on:
  push:
    paths:
      - 'ROUTE_OPERATOR_FIRST_QUANTUM_SELECTION.md'
      - 'scripts/operator_first_route_hda_gate.py'
  pull_request:
    paths:
      - 'ROUTE_OPERATOR_FIRST_QUANTUM_SELECTION.md'
      - 'scripts/operator_first_route_hda_gate.py'
      - 'THEORY_STATUS.md'
      - 'BCQG_CORE_CANDIDATE_V1.md'
      - 'theory_gates.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Syntax
        run: python -m py_compile scripts/operator_first_route_hda_gate.py
      - name: Operator-first logical matrix route HDA
        run: |
          python scripts/operator_first_route_hda_gate.py \
            --L 48 \
            --output verification_results/OPERATOR_FIRST_ROUTE_HDA.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-first-route-hda
          path: verification_results/OPERATOR_FIRST_ROUTE_HDA.json
          if-no-files-found: warn

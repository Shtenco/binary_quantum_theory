name: numerical-continuation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install finite-check dependencies
        run: python -m pip install numpy scipy sympy
      - name: Check scientific status and scale-invariant rank regressions
        run: python -m unittest discover -s tests
      - name: Repeat corrected finite K5 control
        run: python scripts/k5_quantum_geometry_bridge.py --output /tmp/K5_corrected.json
      - name: Replay saved weak element without amplitude regeneration
        run: python docs/numerical_continuation/verify_results.py
      - name: Regenerate three exact local volume blocks
        run: python docs/numerical_continuation/verify_volume_blocks.py
      - name: Verify resumable direct-stage inventory without new HE calls
        run: python docs/numerical_continuation/continue_second_stage.py --output-dir /tmp/bqg_second_stage --max-new-he 0

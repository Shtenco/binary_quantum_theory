name: BQG S4 refinement carrier scan

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_s4_refinement_carrier_scan.py'
      - 'scripts/peter_weyl_j1_s4_block_gate.py'
      - '.github/workflows/bqg-s4-refinement-carrier.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Scan S4 logical carrier tower
        run: |
          mkdir -p verification_results
          python scripts/bqg_s4_refinement_carrier_scan.py \
            --s2-max 8 \
            --output verification_results/BQG_S4_REFINEMENT_CARRIER_SCAN.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-s4-refinement-carrier-scan
          path: verification_results/BQG_S4_REFINEMENT_CARRIER_SCAN.json
          retention-days: 30

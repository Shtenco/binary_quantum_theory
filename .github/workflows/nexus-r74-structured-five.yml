name: NEXUS R7.4 Structured Five-Teacher Deathmatch

on:
  pull_request:
    paths:
      - 'nexus_r74_structured_run/**'
      - '.github/workflows/nexus-r74-structured-five.yml'

jobs:
  teacher:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: qwen3-4b-instruct-2507
            model: qwen3:4b-instruct-2507-q4_K_M
          - id: phi4-mini-reasoning
            model: phi4-mini-reasoning:3.8b-q4_K_M
          - id: ministral3-3b
            model: ministral-3:3b-instruct-2512-q4_K_M
          - id: smollm3-3b
            model: pedrolucas/smollm3:3b-q4_k_m
          - id: gemma3-4b
            model: gemma3:4b-it-q4_K_M
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
      - name: Pull real Q4 teacher
        run: |
          ollama pull '${{ matrix.model }}'
          ollama list > model_list.txt
          ollama show '${{ matrix.model }}' --modelfile > model_modelfile.txt
      - name: Run identical structured benchmark
        env:
          MODEL: ${{ matrix.model }}
          OUT: teacher_result_structured.json
        run: python nexus_r74_multiteacher_lab/teacher_benchmark_structured.py
      - name: Binary evidence
        if: always()
        run: |
          sha256sum ~/.ollama/models/blobs/* > ollama_blob_sha256.txt 2>/dev/null || true
          du -h ~/.ollama/models/blobs/* > ollama_blob_sizes.txt 2>/dev/null || true
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-r74-structured-${{ matrix.id }}
          path: |
            teacher_result_structured.json
            model_list.txt
            model_modelfile.txt
            ollama_blob_sha256.txt
            ollama_blob_sizes.txt
            ollama.log
          retention-days: 30

name: SINERGY Messenger v0.3.3 Android E2E diagnostic
on:
  push:
    branches: [ci-sinergy-messenger-v030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reuse canonical v0.3.3 reconstruction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/sinergy-messenger-v030.yml').read_text().splitlines()
          start=None
          for i,line in enumerate(y):
              if '- name: Restore v0.3.2 and apply full CSP-safe UI fix' in line:
                  start=i
                  break
          if start is None: raise SystemExit('canonical restore step missing')
          run=None
          for i in range(start+1,len(y)):
              if y[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing')
          body=[]
          for line in y[run:]:
              if line.startswith('      - ') or line.startswith('      - uses:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reconstruct-v033.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/reconstruct-v033.sh
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' ci/sinergy-messenger-v033/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/sinergy-messenger-v033/app/src/androidTest/java/ai/sinergy/messenger/secure/FullUiE2ETest.java')
          s=p.read_text()
          old='''              click("[data-action='go'][data-target='chats']"); click("[data-action='showMyCode']"); assertTrue(bool("lastEnvelope.length>100")); eval("document.getElementById('peerCode').value=lastEnvelope;document.querySelector('[data-action=\\"savePeer\\"]').click();'ok'"); assertTrue(waitJs("peer&&peer.fingerprint",30));'''
          new='''              click("[data-action='go'][data-target='chats']");\n              click("[data-action='showMyCode']");\n              assertTrue("myCode failed len="+value("lastEnvelope.length")+" toast="+text("toast"), bool("lastEnvelope.length>100"));\n              String inspect=value("JSON.stringify(call('inspectPeer',lastEnvelope))");\n              assertTrue("inspectPeer failed: "+inspect, inspect.contains("\\\"ok\\\":true"));\n              eval("document.getElementById('peerCode').value=lastEnvelope;document.querySelector('[data-action=\\"savePeer\\"]').click();'ok'");\n              assertTrue("savePeer failed inspect="+inspect+" toast="+text("toast"),waitJs("peer&&peer.fingerprint",10));'''
          if old not in s: raise SystemExit('peer test block not found')
          p.write_text(s.replace(old,new))
          PY
          grep -F 'android.useAndroidX=true' ci/sinergy-messenger-v033/gradle.properties
          node --check ci/sinergy-messenger-v033/app/src/main/assets/www/app.js
          ! grep -Eq 'onclick="|onkeydown="|style="' ci/sinergy-messenger-v033/app/src/main/assets/www/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android SDK
        working-directory: ci/sinergy-messenger-v033
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: PQ unit tests
        working-directory: ci/sinergy-messenger-v033
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release and instrumentation APKs
        working-directory: ci/sinergy-messenger-v033
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android WebView E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd ci/sinergy-messenger-v033 && gradle :app:connectedDebugAndroidTest --stacktrace --info
      - name: Dump E2E XML diagnostics
        if: always()
        run: |
          find ci/sinergy-messenger-v033/app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sinergy-messenger-v0.3.3-e2e-diagnostic2
          path: |
            ci/sinergy-messenger-v033/app/build/outputs/apk/release/app-release-unsigned.apk
            ci/sinergy-messenger-v033/app/build/reports/androidTests/connected/
            ci/sinergy-messenger-v033/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

name: SINERGY Messenger v0.3.3 Android E2E retry
on:
  push:
    branches: [ci-sinergy-messenger-v030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reuse canonical v0.3.3 reconstruction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/sinergy-messenger-v030.yml').read_text().splitlines()
          start=None
          for i,line in enumerate(y):
              if '- name: Restore v0.3.2 and apply full CSP-safe UI fix' in line:
                  start=i
                  break
          if start is None: raise SystemExit('canonical restore step missing')
          run=None
          for i in range(start+1,len(y)):
              if y[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing')
          body=[]
          for line in y[run:]:
              if line.startswith('      - ') or line.startswith('      - uses:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reconstruct-v033.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/reconstruct-v033.sh
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' ci/sinergy-messenger-v033/gradle.properties
          grep -F 'android.useAndroidX=true' ci/sinergy-messenger-v033/gradle.properties
          node --check ci/sinergy-messenger-v033/app/src/main/assets/www/app.js
          ! grep -Eq 'onclick="|onkeydown="|style="' ci/sinergy-messenger-v033/app/src/main/assets/www/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android SDK
        working-directory: ci/sinergy-messenger-v033
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: PQ unit tests
        working-directory: ci/sinergy-messenger-v033
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release and instrumentation APKs
        working-directory: ci/sinergy-messenger-v033
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android WebView E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd ci/sinergy-messenger-v033 && gradle :app:connectedDebugAndroidTest --stacktrace --info
      - name: Dump E2E XML diagnostics
        if: always()
        run: |
          echo '===== INSTRUMENTATION XML ====='
          find ci/sinergy-messenger-v033/app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          echo '===== CONNECTED REPORT FILES ====='
          find ci/sinergy-messenger-v033/app/build/reports/androidTests/connected -type f -maxdepth 8 -print 2>/dev/null || true
      - name: Verify release APK
        if: success()
        working-directory: ci/sinergy-messenger-v033
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='ai.sinergy.messenger.quantum' versionCode='304' versionName='0.3.3'" /tmp/badging.txt
          ! unzip -p "$APK" assets/www/app.js | grep -Eq 'onclick="|onkeydown="|style="'
          unzip -p "$APK" assets/www/app.js | grep -F 'const ACTIONS='
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sinergy-messenger-v0.3.3-e2e-diagnostics
          path: |
            ci/sinergy-messenger-v033/app/build/outputs/apk/release/app-release-unsigned.apk
            ci/sinergy-messenger-v033/app/build/outputs/apk/release/SHA256SUMS.txt
            ci/sinergy-messenger-v033/app/build/reports/androidTests/connected/
            ci/sinergy-messenger-v033/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

name: collective-16cell-pairing-stabilizer-covariance

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'scripts/lorentzian_pairing_stabilizer_orbit_gate.py'
      - 'scripts/collective_16cell_pairing_stabilizer_covariance_gate.py'
      - 'scripts/pl_dual_complex.py'
      - 'scripts/pl_peter_weyl_euclidean.py'
      - '.github/workflows/collective-16cell-pairing-stabilizer-covariance.yml'
  workflow_dispatch:

jobs:
  theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Structural orbit theorem
        run: python scripts/lorentzian_pairing_stabilizer_orbit_gate.py --output verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS.json
      - name: Exact sparse Peter-Weyl covariance
        run: python scripts/collective_16cell_pairing_stabilizer_covariance_gate.py --output verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE.json
      - name: Hard guards
        run: |
          python - <<'PY'
          import json
          a=json.load(open('verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS.json'))
          b=json.load(open('verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE.json'))
          assert a['passed'] and a['worker_orbits']==[[0,1,6,7,16,17,22,23],[2,4,8,10,13,15,19,21],[3,5,9,11,12,14,18,20]]
          assert b['passed'] and b['order']==8
          assert b['checks']['global_K0_seed_invariant']
          assert b['checks']['E_pseudoscalar_amplitude_covariance']
          assert b['max_E_relative_covariance_error']<1e-9
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-16cell-pairing-stabilizer-covariance
          path: |
            verification_results/LORENTZIAN_PAIRING_STABILIZER_ORBITS.json
            verification_results/COLLECTIVE_16CELL_PAIRING_STABILIZER_COVARIANCE.json
          if-no-files-found: error

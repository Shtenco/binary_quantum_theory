name: active-habitat-master-flow-v2-research

on:
  push:
    branches:
      - 'audit/active-habitat-master-v2'
    paths:
      - 'ACTIVE_HABITAT_MASTER_FLOW_V2_PREREGISTRATION.md'
      - 'scripts/active_habitat_master_flow_v2_gate.py'
      - 'scripts/active_habitat_master_constraint_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/active-habitat-master-flow-v2-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-habitat-master-flow-v2-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  depth2-master-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile preregistered depth-2 gate
        run: |
          python -m py_compile scripts/active_habitat_master_constraint_gate.py
          python -m py_compile scripts/active_habitat_master_flow_v2_gate.py
      - name: Run preregistered deterministic depth-2 master flow
        run: |
          python scripts/active_habitat_master_flow_v2_gate.py \
            --output verification_results/ACTIVE_HABITAT_MASTER_FLOW_V2.json
      - name: Cross-guard preregistration and claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('verification_results/ACTIVE_HABITAT_MASTER_FLOW_V2.json')
          x = json.loads(p.read_text())
          assert x['passed'] is True
          assert x['nodes'] == [0, 1, 2]
          assert x['Jmax'] == 2.5
          assert x['checks']['P1_retained_as_leading_P2_basis'] is True
          assert x['checks']['P1_full_master_is_P2_principal_block'] is True
          assert x['checks']['all_P1_one_step_images_lie_in_P2_by_construction'] is True
          assert x['checks']['rayleigh_ritz_minimum_nonincreasing'] is True
          assert x['checks']['P1_master_checks_pass'] is True
          assert x['checks']['P2_master_checks_pass'] is True
          assert 'not a continuum rigging map' in x['claim_boundary']
          assert 'no Hamiltonian-constraint eigenvalue is identified with physical omega' in x['claim_boundary']
          print('depth-2 master-flow cross-guard: PASS')
          print('science_status:', x['science_status'])
          print('dimensions:', {k: x['depths'][k]['dimension'] for k in ('P0','P1','P2')})
          print('gap_flow:', x['master_gap_flow'])
          print('P2_max_leakage_ratio:', x['depths']['P2']['max_node_leakage_ratio'])
          PY
      - name: Upload depth-2 master-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-habitat-master-flow-v2-evidence
          path: verification_results/ACTIVE_HABITAT_MASTER_FLOW_V2.json
          if-no-files-found: error

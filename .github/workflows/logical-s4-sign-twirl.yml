name: logical-s4-sign-twirl

on:
  push:
    branches:
      - research/logical-s4-sign-twirl
  pull_request:
    paths:
      - 'scripts/logical_s4_sign_twirl_gate.py'
      - 'scripts/logical_s4_twirl_gate.py'
      - '.github/workflows/logical-s4-sign-twirl.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Exact S4 sign-character twirl
        run: python scripts/logical_s4_sign_twirl_gate.py

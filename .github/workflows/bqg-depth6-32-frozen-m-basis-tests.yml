name: BQG depth6 32 frozen-m numerical tests

on:
  push:
    branches:
      - bqg/depth6-32-canonical-recovery
    paths:
      - 'scripts/depth6_32_frozen_m_basis.py'
      - 'scripts/depth6_32_keymeta_first.py'
      - 'scripts/depth6_32_replay_authorization.py'
      - 'scripts/run_depth6_32_ledger_batch.py'
      - 'scripts/test_depth6_32_frozen_m_basis.py'
      - 'scripts/test_depth6_32_keymeta_first.py'
      - 'scripts/test_depth6_32_replay_authorization.py'
      - 'scripts/test_run_depth6_32_ledger_batch.py'
      - '.github/workflows/bqg-depth6-32-frozen-m-basis-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scipy sympy
      - name: Extract immutable frozen Stage-A engine
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_COMMIT=887e76fba5210524650002da0b54653d2c5b37fd
          EXPECTED_BLOB=cbbaa80f6b6b61d353458db1fa1f03f824730532
          git fetch --no-tags origin "$FROZEN_COMMIT"
          ACTUAL_BLOB="$(git rev-parse "$FROZEN_COMMIT:mixed_parallel/bqg_mixed_master_bundle.tar.gz.b64")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          mkdir -p frozen_engine
          git show "$FROZEN_COMMIT:mixed_parallel/bqg_mixed_master_bundle.tar.gz.b64" > /tmp/bundle.b64
          base64 -d /tmp/bundle.b64 | tar xzf - -C frozen_engine
      - name: Run frozen-m numerical contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/frozen_engine
        working-directory: scripts
        run: |
          python -m unittest -v \
            test_depth6_32_frozen_m_basis.py \
            test_depth6_32_keymeta_first.py \
            test_depth6_32_replay_authorization.py \
            test_run_depth6_32_ledger_batch.py

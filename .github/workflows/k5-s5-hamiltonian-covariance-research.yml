name: k5-s5-hamiltonian-covariance-research

on:
  push:
    branches:
      - 'audit/k5-s5-hamiltonian-covariance-v1'
    paths:
      - 'K5_S5_GRAPH_CHANGING_HAMILTONIAN_COVARIANCE_PREREGISTRATION.md'
      - 'scripts/k5_s5_graph_changing_hamiltonian_covariance_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/k5-s5-hamiltonian-covariance-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k5-s5-hamiltonian-covariance-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-s5-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile graph-changing covariance gate
        run: python -m py_compile scripts/k5_s5_graph_changing_hamiltonian_covariance_gate.py
      - name: Run full 32D safe-cutoff S5 Hamiltonian covariance theorem
        run: |
          python scripts/k5_s5_graph_changing_hamiltonian_covariance_gate.py \
            --output verification_results/K5_S5_GRAPH_CHANGING_HAMILTONIAN_COVARIANCE.json
      - name: Guard no-projection claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('verification_results/K5_S5_GRAPH_CHANGING_HAMILTONIAN_COVARIANCE.json').read_text())
          assert x['passed'] is True
          assert x['Jmax'] == 2.5
          assert x['input_dimension'] == 32
          assert x['number_H_columns'] == 160
          assert x['number_state_level_covariance_tests'] == 640
          assert x['checks']['orientation_cofactor_identity_all_600_pairs'] is True
          assert x['checks']['raw_graph_changing_H_covariant_on_all_640_tests'] is True
          assert x['checks']['boundary_oriented_H_is_S5_pseudoscalar_vector_on_all_640_tests'] is True
          assert x['checks']['full_image_master_invariant_under_all_120_S5_elements'] is True
          assert 'does not prove HDA closure' in x['claim_boundary']
          print('safe K5 S5 graph-changing covariance scope guard: PASS')
          print('science_status:',x['science_status'])
          print('unique_output_keys:',x['unique_graph_changing_output_keys'])
          print('max_H_covariance_defect:',x['max_raw_H_covariance_relative_state_defect'])
          print('max_master_S5_defect:',x['max_master_S5_invariance_relative_defect'])
          PY
      - name: Upload graph-changing covariance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-s5-hamiltonian-covariance-evidence
          path: verification_results/K5_S5_GRAPH_CHANGING_HAMILTONIAN_COVARIANCE.json
          if-no-files-found: error

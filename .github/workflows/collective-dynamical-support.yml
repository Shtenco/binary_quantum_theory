name: collective-dynamical-support

on:
  push:
    branches:
      - research/bcqg-core-candidate-v1
    paths:
      - 'COLLECTIVE_BARYCENTRIC_S_BOUNDARY_SUPPORT.md'
      - 'scripts/collective_barycentric_E_boundary_support_gate.py'
      - 'scripts/collective_barycentric_S_boundary_support_gate.py'
      - 'scripts/pl_dual_complex.py'
      - '.github/workflows/collective-dynamical-support.yml'
  workflow_dispatch:

jobs:
  exact-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: |
          python -m py_compile scripts/pl_dual_complex.py
          python -m py_compile scripts/collective_barycentric_E_boundary_support_gate.py
          python -m py_compile scripts/collective_barycentric_S_boundary_support_gate.py
      - name: Exact one-E support
        run: python scripts/collective_barycentric_E_boundary_support_gate.py --output verification_results/COLLECTIVE_BARYCENTRIC_E_BOUNDARY_SUPPORT.json
      - name: Exact conservative one-S support
        run: python scripts/collective_barycentric_S_boundary_support_gate.py --output verification_results/COLLECTIVE_BARYCENTRIC_S_BOUNDARY_SUPPORT.json
      - name: Cross-check production wall
        run: |
          python - <<'PY'
          import json
          e=json.load(open('verification_results/COLLECTIVE_BARYCENTRIC_E_BOUNDARY_SUPPORT.json'))
          s=json.load(open('verification_results/COLLECTIVE_BARYCENTRIC_S_BOUNDARY_SUPPORT.json'))
          assert e['passed'] and s['passed']
          assert e['required_coarse_face_spins']==[x/2 for x in range(9)]
          assert s['required_coarse_face_spins']==[x/2 for x in range(13)]
          assert s['one_step_production_face_wall']==6.0
          PY
      - name: Upload support evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collective-dynamical-support
          path: |
            verification_results/COLLECTIVE_BARYCENTRIC_E_BOUNDARY_SUPPORT.json
            verification_results/COLLECTIVE_BARYCENTRIC_S_BOUNDARY_SUPPORT.json
          if-no-files-found: error

name: SINERGY Messenger v0.3.2 Keyboard Fix
on:
  push:
    branches: [ci-sinergy-messenger-v030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and apply keyboard fix
        run: |
          set -euo pipefail
          mkdir -p ci/sinergy-messenger-v032
          head -c 6000 ci/v030/part00.b64 > /tmp/v030.b64
          cat ci/v030/part01.b64 ci/v030/part02.b64 ci/v030/part03.b64 ci/v030/part04.b64 ci/v030/part05.b64 ci/v030/part06.b64 >> /tmp/v030.b64
          base64 -d /tmp/v030.b64 > /tmp/v030.zip
          test "$(sha256sum /tmp/v030.zip | cut -d' ' -f1)" = "4a4125854b711eb83e4aeeb43c2d3d4e4d744d4f89d470fc781fba264bdf108a"
          unzip -q /tmp/v030.zip -d ci/sinergy-messenger-v032
          cat ci/v031/patch00.b64 ci/v031/patch01.b64 ci/v031/patch02.b64 ci/v031/patch03.b64 ci/v031/patch04.b64 ci/v031/patch05.b64 ci/v031/patch06.b64 > /tmp/v031.b64
          base64 -d /tmp/v031.b64 > /tmp/v031-patch.zip
          test "$(sha256sum /tmp/v031-patch.zip | cut -d' ' -f1)" = "596b82eed0c17a1014ef65ef0a8d52b36e195c2e2b4f009f3d93d8b533166635"
          unzip -qo /tmp/v031-patch.zip -d ci/sinergy-messenger-v032
          mkdir -p ci/sinergy-messenger-v032/app/src/main/res/drawable
          cp ci/sinergy-messenger-v032/app/src/main/assets/www/sinergy-logo.png ci/sinergy-messenger-v032/app/src/main/res/drawable/sinergy_logo.png
          sed -i 's/version "9.4.0"/version "9.0.0"/' ci/sinergy-messenger-v032/build.gradle.kts
          sed -i 's/applicationId = "ai.sinergy.messenger.secure"/applicationId = "ai.sinergy.messenger.quantum"/' ci/sinergy-messenger-v032/app/build.gradle.kts
          sed -i 's/versionCode = 301/versionCode = 303/' ci/sinergy-messenger-v032/app/build.gradle.kts
          sed -i 's/versionName = "0.3.1"/versionName = "0.3.2"/' ci/sinergy-messenger-v032/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ci/sinergy-messenger-v032/app/src/main/assets/www/app.js')
          s=p.read_text()
          old="async function boot(){setNav();refreshStatus();if(status?.registered)loadLocal();render();setInterval(()=>{refreshStatus(false);if(tab==='home'||tab==='security')render()},1000)}"
          new="async function boot(){setNav();refreshStatus();if(status?.registered)loadLocal();render();setInterval(()=>{refreshStatus(false)},1000)}"
          if old not in s: raise SystemExit('old boot loop not found')
          p.write_text(s.replace(old,new))
          m=Path('ci/sinergy-messenger-v032/app/src/main/AndroidManifest.xml')
          x=m.read_text()
          if 'android:windowSoftInputMode=' not in x:
              x=x.replace('android:exported="true"','android:exported="true" android:windowSoftInputMode="adjustResize"')
          m.write_text(x)
          PY
          grep -F 'applicationId = "ai.sinergy.messenger.quantum"' ci/sinergy-messenger-v032/app/build.gradle.kts
          grep -F 'versionCode = 303' ci/sinergy-messenger-v032/app/build.gradle.kts
          grep -F 'versionName = "0.3.2"' ci/sinergy-messenger-v032/app/build.gradle.kts
          grep -F 'setInterval(()=>{refreshStatus(false)},1000)' ci/sinergy-messenger-v032/app/src/main/assets/www/app.js
          ! grep -F "if(tab==='home'||tab==='security')render()" ci/sinergy-messenger-v032/app/src/main/assets/www/app.js
          grep -F 'android:windowSoftInputMode="adjustResize"' ci/sinergy-messenger-v032/app/src/main/AndroidManifest.xml
          node --check ci/sinergy-messenger-v032/app/src/main/assets/www/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android SDK
        working-directory: ci/sinergy-messenger-v032
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: PQ tests
        working-directory: ci/sinergy-messenger-v032
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: ci/sinergy-messenger-v032
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify keyboard fix and APK
        working-directory: ci/sinergy-messenger-v032
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='ai.sinergy.messenger.quantum' versionCode='303' versionName='0.3.2'" /tmp/badging.txt
          unzip -p "$APK" assets/www/app.js | grep -F 'setInterval(()=>{refreshStatus(false)},1000)'
          ! unzip -p "$APK" assets/www/app.js | grep -F "if(tab==='home'||tab==='security')render()"
          unzip -l "$APK" | grep -F 'assets/www/sinergy-logo.png'
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sinergy-messenger-v0.3.2-keyboardfix-unsigned
          path: |
            ci/sinergy-messenger-v032/app/build/outputs/apk/release/app-release-unsigned.apk
            ci/sinergy-messenger-v032/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

name: active-habitat-master-research

on:
  push:
    branches:
      - 'audit/active-habitat-master-v1'
    paths:
      - 'ACTIVE_HABITAT_MASTER_CONSTRAINT_PREREGISTRATION.md'
      - 'scripts/active_habitat_master_constraint_gate.py'
      - 'scripts/k5_peter_weyl_safe_hda_column.py'
      - '.github/workflows/active-habitat-master-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-habitat-master-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-habitat-master:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile leakage-aware gate
        run: python -m py_compile scripts/active_habitat_master_constraint_gate.py
      - name: Run preregistered active-habitat master diagnostic
        run: |
          python scripts/active_habitat_master_constraint_gate.py \
            --output verification_results/ACTIVE_HABITAT_MASTER_CONSTRAINT.json
      - name: Cross-guard claim boundary and decomposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('verification_results/ACTIVE_HABITAT_MASTER_CONSTRAINT.json')
          x = json.loads(p.read_text())
          assert x['passed'] is True
          assert x['nodes'] == [0, 1, 2]
          assert x['Jmax'] == 2.5
          assert x['master']['decomposition_relative_error'] <= 5e-8
          assert x['checks']['exact_master_leakage_decomposition'] is True
          assert x['checks']['full_master_positive_semidefinite'] is True
          assert x['checks']['leakage_master_positive_semidefinite'] is True
          assert 'not a continuum rigging map' in x['claim_boundary']
          assert 'not a graviton propagator' in x['claim_boundary']
          print('active-habitat master cross-guard: PASS')
          print('science_status:', x['science_status'])
          print('max_node_leakage_ratio:', x['master']['max_node_leakage_ratio'])
          print('spurious_projected_zero_detected:', x['master']['spurious_projected_zero_detected'])
          PY
      - name: Upload active-habitat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-habitat-master-evidence
          path: verification_results/ACTIVE_HABITAT_MASTER_CONSTRAINT.json
          if-no-files-found: error

name: peter-weyl-lorentzian-single-mitm
on:
  push:
    branches: [research/pw-lorentzian-single-mitm]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Safe single-triple MITM logical matrix
        run: python scripts/peter_weyl_lorentzian_single_mitm_gate.py --output verification_results/PETER_WEYL_LORENTZIAN_SINGLE_MITM.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peter-weyl-lorentzian-single-mitm-evidence
          path: verification_results/PETER_WEYL_LORENTZIAN_SINGLE_MITM.json

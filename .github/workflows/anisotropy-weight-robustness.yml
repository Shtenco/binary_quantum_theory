name: anisotropy-weight-robustness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/peter_weyl_anisotropy_weight_robustness_gate.py'
      - 'scripts/peter_weyl_logical_anisotropy_gate.py'
      - '.github/workflows/anisotropy-weight-robustness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/peter_weyl_anisotropy_weight_robustness_gate.py'
      - 'scripts/peter_weyl_logical_anisotropy_gate.py'
      - '.github/workflows/anisotropy-weight-robustness.yml'

permissions:
  contents: read

concurrency:
  group: anisotropy-weight-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-weight-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile scripts/peter_weyl_anisotropy_weight_robustness_gate.py
      - name: Positive-weight intermediate-state anisotropy decomposition
        run: python scripts/peter_weyl_anisotropy_weight_robustness_gate.py --output verification_results/PETER_WEYL_ANISOTROPY_WEIGHT_ROBUSTNESS.json
      - name: Upload robustness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anisotropy-weight-robustness-evidence
          path: verification_results/
          if-no-files-found: warn

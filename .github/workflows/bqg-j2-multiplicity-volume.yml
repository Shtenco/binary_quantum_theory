name: BQG j2 multiplicity volume

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bqg_j2_multiplicity_volume_gate.py'
      - '.github/workflows/bqg-j2-multiplicity-volume.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Compute j2 multiplicity-volume gate
        run: |
          mkdir -p verification_results
          python scripts/bqg_j2_multiplicity_volume_gate.py \
            --output verification_results/BQG_J2_MULTIPLICITY_VOLUME.json
      - uses: actions/upload-artifact@v4
        with:
          name: bqg-j2-multiplicity-volume
          path: verification_results/BQG_J2_MULTIPLICITY_VOLUME.json
          retention-days: 30

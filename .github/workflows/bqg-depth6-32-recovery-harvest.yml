name: BQG depth6 [3,2] legacy raw recovery harvest
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing mixed Stage-A run ID containing all 112 raw [3,2] shard artifacts (legacy/manual only)
        required: true
        type: string

# IMPORTANT: automatic workflow_run triggering was deliberately removed on
# 2026-10-01. Real Stage-A artifacts are multi-gigabyte (1.97-2.67 GB observed
# per completed shard), so downloading 112 raw shards onto one hosted runner is
# not a viable recovery architecture. The active path is per-shard compact QR
# evidence followed by fail-closed QR peeling and raw coupled checking only for
# a residual. This file is retained only as a manual historical fallback.

permissions:
  contents: read
  actions: read

jobs:
  recover-32-legacy-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
          path: proofsrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install --disable-pip-version-check numpy scipy
      - name: Fail closed unless explicitly dispatched
        run: |
          test "${{ github.event_name }}" = "workflow_dispatch"
          echo "LEGACY_RAW_RECOVERY_MANUAL_ONLY source_run=${{ inputs.source_run_id }}"
      - name: Download exactly 112 persisted [3,2] numerical master-map shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/download_workflow_artifacts_paginated.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${{ inputs.source_run_id }}" \
            --prefix "bqg-mixed-32-shard-" \
            --expected 112 \
            --out mixed_downloaded
      - name: Legacy recovery-only independent numerical master witness
        env:
          PYTHONPATH: ${{ github.workspace }}/proofsrc/mixed_parallel
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u proofsrc/mixed_parallel/bqg_mixed_master_recovery.py \
            --irrep 32 \
            --artifacts mixed_downloaded \
            --expected-shards 112 \
            --prefix bqg-mixed-32-shard- \
            --source-run-id "${{ inputs.source_run_id }}" \
            --work mixed_recovery32 \
            --out BQG_DEPTH6_32_MASTER_RECOVERY.json
      - name: Upload legacy recovery certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bqg-depth6-32-legacy-raw-recovery-certificate
          path: BQG_DEPTH6_32_MASTER_RECOVERY.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require only a genuine finite numerical PASS
        run: |
          python - <<'PY'
          import json
          x=json.load(open('BQG_DEPTH6_32_MASTER_RECOVERY.json'))
          assert x['structural_status']=='CLOSED_IMMUTABLE_INPUT',x
          assert x['structural_recompute_performed'] is False,x
          assert x['support_source']=='persisted_master_map_keys_only',x
          assert x['target_blocks']==2755 and x['target_columns']==130903,x
          assert x['recovered_blocks']==2755 and x['recovered_columns']==130903,x
          assert x['status']=='PASS_CLOSED_FINITE_NUMERICAL',x
          assert x['kernel_dimension']==0,x
          print('DEPTH6_32_RECOVERY_PASS', x.get('global_sigma_min'))
          PY

name: logical-s4-twirl-regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/logical_s4_twirl_gate.py'
      - '.github/workflows/logical-s4-twirl-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/logical_s4_twirl_gate.py'
      - '.github/workflows/logical-s4-twirl-regression.yml'

permissions:
  contents: read

jobs:
  verify-s4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Exact logical S4 twirl
        run: python scripts/logical_s4_twirl_gate.py --output verification_results/LOGICAL_S4_TWIRL.json
      - name: Upload S4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-s4-evidence
          path: verification_results/
          if-no-files-found: warn

name: BQG depth6 compact QR tests
on:
  push:
    branches: [research/depth6-s4sign-proof]
    paths:
      - 'mixed_parallel/compress_master_map_qr.py'
      - 'mixed_parallel/aggregate_compact_master_qr.py'
      - 'mixed_parallel/test_compact_master_qr.py'
      - '.github/workflows/bqg-depth6-compact-qr-tests.yml'
  workflow_dispatch:

jobs:
  compact-qr-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/depth6-s4sign-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Run compact QR witness tests
        env:
          PYTHONPATH: ${{ github.workspace }}/mixed_parallel
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest -v mixed_parallel/test_compact_master_qr.py
